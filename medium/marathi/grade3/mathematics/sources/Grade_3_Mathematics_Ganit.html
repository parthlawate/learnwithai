- **३. बेरीज व वजाबाकी** (पृष्ठ २५–३६) : ३ अंकी संख्यांची बेरीज (बिनहातची व हातची) आणि वजाबाकी (बिनउसण्याची व उसण्याची/हातची), संख्याबंध, शाब्दिक उदाहरणे.

- **५. लांबी व वजन** (पृष्ठ ४७–५३) : लांबी (मीटर, सेंटीमीटर), वजन (ग्रॅम, किलोग्रॅम), तराजू व प्रमाणित मापे.

# १. सभोवताली शोधू आकार

*(पाठ्यपुस्तक पृष्ठ १ ते ६ | पृष्ठचित्रे: page-013.png ते page-018.png)*

### [पृष्ठ १]

**विनामूल्य वितरणासाठी**

#### आठवा.
◎ **चित्राचे निरीक्षण करा आणि त्यातील वस्तूंचे आकार ओळखा.**

*(चित्रात: वाढदिवसाचा प्रसंग - टेबलवर भेटवस्तूंचा डबा, रुबिक्स क्यूब/फासा, केक, वाढदिवसाची जोकर टोपी आणि चेंडू ठेवलेले आहेत.)*

◎ **निरीक्षण करून सारणी पूर्ण करा.**

| वस्तू | वस्तूंच्या आकारांशी जुळणारे भौमितिक आकार | भौमितिक आकाराचे नाव |
| :---: | :---: | :---: |
| [भेटवस्तूचा डबा] | [इष्टिकाचिती आकृती] | इष्टिकाचिती |
| [रुबिक्स क्यूब] | [घन आकृती] | ................... *(घन)* |
| [केक] | [दंडगोल आकृती] | ................... *(वृत्तचिती / दंडगोल)* |
| [जोकर टोपी] | [शंकू आकृती] | ................... *(शंकू)* |
| [रंगीत चेंडू] | [गोल आकृती] | ................... *(गोल)* |

◎ **ओळखा मी कोण ?**
(१) मला दोन वक्र कडा आणि एक वक्र पृष्ठ आहे पण एकही कोपरा नाही. ................... *(दंडगोल / वृत्तचिती)*  
(२) मला एक कोपरा, एक वक्र पृष्ठ आणि एक सपाट पृष्ठ आहे. ................... *(शंकू)*  
(३) मला एकही कोपरा नाही, एकही कडा नाही. फक्त एक वक्र पृष्ठ आहे. ................... *(गोल)*

### [पृष्ठ २]

#### संवाद व घडणी समजून घ्या:

* **मुलगा:** "मला किती छान भेटवस्तू मिळाल्या आहेत."
* **मुलगी:** "अरे ! या खोक्याकडे बघा."
* **दुसरी मुलगी:** "अरे, हे तर मजेशीर आहे. या इष्टिकाचिती आकाराच्या खोक्याला १२ कडा, ८ कोपरे आणि ६ पृष्ठे दिसत आहेत."
* **दुसरा मुलगा:** "हा खोका उलगडून बघायचा का ? म्हणजे आपल्याला हा खोका कसा तयार झाला हे कळेल."

---

* **मुलगी:** "ज्या आकारापासून खोका तयार होतो त्या आकाराला **खोक्याची घडणी** म्हणतात. ही इष्टिकाचितीची घडणी बघा."  
  *(सोबत इष्टिकाचितीची उलगडलेली घडणी दर्शवली आहे.)*
* **दुसरी मुलगी:** "आपण इतर आकारांची खोकी उघडून त्यांच्या घडणी पाहू या का ?"  
  *(सोबत शंकूची उलगडलेली घडणी दर्शवली आहे.)*

### [पृष्ठ ३]

#### त्रिमितीय आकार व घडणी

> या घडणीचा उपयोग करून ही इष्टिकाचिती बनवली आहे.  
> *(पिवळ्या व हिरव्या रंगातील इष्टिकाचितीची घडणी व त्यापासून तयार होणारी इष्टिकाचिती)*

◎ **खालील सारणीचे निरीक्षण करा आणि वस्तूंच्या घडणींनुसार आकाराशी त्यांच्या जोड्या लावा.**

| अ.क्र. | आकाराच्या घडणी | आकार | आकाराचे नाव |
| :---: | :---: | :---: | :---: |
| (१) | [शंकूची घडणी: वर्तुळाकार तळ व त्रिकोणी/वृत्तचिती भाग] | [उभी इष्टिकाचिती] | इष्टिकाचिती |
| (२) | [दंडगोलाची घडणी: आयत व दोन्ही बाजूंस दोन वर्तुळे] | [शंकू] | शंकू |

### [पृष्ठ ७]

**विनामूल्य वितरणासाठी**

#### संख्यांची उत्पत्ती व इतिहास:

* **मुलगी:** "पूर्वीच्या काळात माणसे वस्तूंची मोजणी कशी करत होती ? तेव्हासुद्धा संख्या होत्या का ?"
* **मुलगा:** "प्राचीन काळात मानव गुहेतील भिंतीवर, झाडांच्या खोडांवर खुणा करत मोजणी करायचा, काही काळानंतर त्याने समूहासाठी चिन्हे वापरून गटाच्या रूपात मोजणी करायला सुरुवात केली."
* **दुसरा मुलगा:** "संख्यांचा शोध कधी लागला ? आणि कसा लागला ?"
* **विद्यार्थी:** "एका वस्तूसाठी ‘एक’ हे नाव आणि १ हे चिन्ह ठरवले गेले. एका वस्तूमध्ये १ वस्तू मिळवली की जो समूह तयार होतो त्याला ‘दोन’ हे नाव व ‘२’ हे चिन्ह दिले. अशा प्रकारे वस्तूंच्या मोजणीसाठी एक, दोन, तीन..... नऊ ही संख्यानामे दिली गेली व त्यांच्यासाठी १, २, ३, ४, ५, ६, ७, ८, ९ ही संख्याचिन्हे ठरवली गेली."
* **मुलगी:** "‘काहीच नाही’ हे दाखवण्यासाठी ‘शून्य’ (०) वापरतात. ९ या संख्येमध्ये १ मिळवला की तयार होणारा समूह म्हणजे ‘दहा’. आपण दहा लिहिताना ‘१०’ हे संख्याचिन्ह वापरतो."
* **विद्यार्थी:** "भारतीय गणिततज्ज्ञांनी लावलेला ‘शून्याचा शोध’ ही जगाला दिलेली मोठी देणगी आहे."

> **शिक्षकांसाठी :** ०, १, २, ३, ४, ५, ६, ७, ८, ९ ही दहा संख्याचिन्हे आहेत. यांचा उपयोग करून एक अंकी, दोन अंकी, .... या प्रकारे कितीही मोठी संख्या असेल तर ती संख्या ओळखणे, वाचणे व लिहिणे सोपे जाते. शून्याच्या शोधामुळे हे शक्य झाले आहे. वस्तूंच्या समूहासाठी आपण कोणती चिन्हे वापरतो याचा विद्यार्थ्यांना अनुभव द्यावा.

### [पृष्ठ १४]

#### संख्येतील अंकांचे दर्शनी व स्थानिक किंमत

**समजून घ्या.**

* **संख्या ५२४:**
  * ५ ची दर्शनी किंमत = ५ | ५ ची स्थानिक किंमत = ५०० (५ शतक)
  * २ ची दर्शनी किंमत = २ | २ ची स्थानिक किंमत = २० (२ दशक)
  * ४ ची दर्शनी किंमत = ४ | ४ ची स्थानिक किंमत = ४ (४ एकक)

* **संख्या ८०९:**
  * ८ ची दर्शनी किंमत = ८ | ८ ची स्थानिक किंमत = ८०० (८ शतक)
  * ० ची दर्शनी किंमत = ० | ० ची स्थानिक किंमत = ० (० दशक)
  * ९ ची दर्शनी किंमत = ९ | ९ ची स्थानिक किंमत = ९ (९ एकक)

> **मला समजले :**  
> * संख्येतील अंकाची **दर्शनी किंमत** ही त्या अंकाएवढीच असते.  
> * संख्येतील अंकाची **स्थानिक किंमत** अंकांच्या स्थानानुसार ठरते.  
> * संख्येत शून्य कोणत्याही स्थानावर असेल तरी त्याची दर्शनी व स्थानिक किंमत **शून्यच** असते.

* घड्या घातल्याने ‘००+’ आणि ‘०+’ हे झाकले गेले. आता ७३५ ही संख्या दिसते.

### [पृष्ठ १७]

#### संख्यांचा लहान-मोठेपणा

**समजून घ्या.**

* **संवाद १:**
  * "६ आणि ९ यांतील मोठी संख्या कोणती ?"
  * "$९ > ६$ मला माहित आहे की ९ ही संख्या ६ पेक्षा मोठी आहे."
* **संवाद २:**
  * "३६ आणि २९ यांतील मोठी संख्या कोणती ?"
  * "$३६ > २९$ हे मी दशक स्थानांच्या अंकांवरून ठरवले."
* **संवाद ३:**
  * "१७८ व ९९ या संख्यांमधील मोठी संख्या कोणती ?"
  * "१७८ ही तीन अंकी संख्या आहे ९९ ही दोन अंकी संख्या आहे. म्हणून $१७८ > ९९$. म्हणजेच १७८ ही संख्या ९९ पेक्षा मोठी आहे."
* **संवाद ४:**
  * "४९५ व ८१२ यांतील लहान संख्या ओळखा व योग्य चिन्ह लिहा."
  * "शतक स्थानांच्या अंकांवरून ठरवले की, $४९५ < ८१२$."
* **संवाद ५:**
  * "३१४ व ३१९ या संख्यांमधील लहान संख्या कशी ठरवायची ?"
  * "येथे शतक समान आहेत, म्हणून दशक व एकक स्थानांचे अंक पाहू. येथे दशक स्थानांचे अंकही समान आहेत. म्हणून एकक स्थानांच्या अंकांवरून ठरवू. $४ < ९$, यावरून $३१४ < ३१९$."

> **मला समजले :**  
> तीन अंकी संख्यांमधील लहानमोठेपणा ठरवताना प्रथम शतक स्थानांच्या अंकांची तुलना करतात. शतक स्थानांचे अंक समान असतील तर दशक स्थानांच्या अंकांची तुलना करतात. शतक व दशक स्थानांचे अंक समान असतील तर एकक स्थानांच्या अंकांची तुलना करतात.

* ५२३ या संख्येतील दशक व एकक स्थानांच्या अंकांची अदलाबदल करून तयार होणारी संख्या :

* ७१६ या संख्येतील शतक व दशक स्थानांच्या अंकांची अदलाबदल करून तयार होणारी संख्या :  
  $\boxed{१७६}$ : **एकशे शहात्तर**
* ८०४ या संख्येतील शतक व एकक स्थानांच्या अंकांची अदलाबदल करून तयार होणारी संख्या :  
  $\boxed{४०८}$ : **चारशे आठ**

### [पृष्ठ २२]

#### नाणी आणि नोटा

**समजून घ्या.**

◎ **या नोटांचे मूल्य लिहा.**
* ₹ १०० ची नोट ➔ ₹ $\boxed{१००}$
* ₹ २०० ची नोट ➔ ₹ $\boxed{२००}$
* ₹ ५०० ची नोट ➔ ₹ $\boxed{५००}$

◎ **नोटा व नाणी मोजा. एकूण रक्कम किती रुपये ते लिहा.**

| नाण्यांचे व नोटांचे चित्र | रक्कम अंकांत | रक्कम अक्षरांत |
| :--- | :---: | :--- |
| ₹ १०० ची १ नोट, ₹ १ चे १ नाणे | ₹ १०१ | एकशे एक रुपये |
| ₹ १०० ची १ नोट, ₹ १ ची २ नाणी | ₹ १०२ | **एकशे दोन रुपये** |
| ₹ १०० ची १ नोट, ₹ ५० ची १ नोट | ₹ १५० | एकशे पन्नास रुपये |
| ₹ १०० च्या २ नोटा | ₹ २०० | **दोनशे रुपये** |
| ₹ २०० ची १ नोट, ₹ ५० ची १ नोट | ₹ २५० | **दोनशे पन्नास रुपये** |

◎ **रवीराजने ४५० रुपयांचे दप्तर आणले. ही रक्कम वेगवेगळ्या प्रकारे कशी देता येईल ?**

* **प्रकार १ :** ₹ १०० च्या ४ नोटा + ₹ ५० ची १ नोट = ₹ ४५०
* **प्रकार २ :** ₹ २०० च्या २ नोटा + ₹ ५० ची १ नोट = ₹ ४५०
* **प्रकार ३ :** ₹ ५० च्या ९ नोटा = ₹ ४५०
* **प्रकार ४ :** ₹ २०० ची १ नोट + ₹ १०० च्या २ नोटा + ₹ ५० ची १ नोट = ₹ ४५०

### [पृष्ठ २३]

#### मूल्यवाचक व क्रमवाचक संख्या

**समजून घ्या.**

*(बस थांबा - रांगेत उभी असलेली मुले)*

| मुलांची नावे | हसन | सुमित | रोहन | मेरी | गौरवी | अर्णव | अदिती |
| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
| **क्रमांक** | पहिला | दुसरा | तिसरा | चौथा | पाचवा | सहावा | सातवा |

* बसच्या रांगेत एकूण ७ मुले आहेत. येथे **७ ही मूल्यवाचक संख्या** आहे.
* रांगेत गौरवीचा क्रमांक कितवा आहे ? ➔ $\boxed{\text{पाचवा}}$
* मेरी कितव्या क्रमांकावर आहे ? ➔ $\boxed{\text{चौथ्या}}$
* अदिती रांगेत कितवी आहे ? ➔ $\boxed{\text{सातवी}}$

> येथे पाचवा, चौथ्या, सातवी ह्या **क्रमवाचक संख्या** आहेत.  
> १, २, ३, ४, ५, ...... ह्या **मूल्यवाचक संख्या** आहेत.  
> पहिला, दुसरा, तिसरा, ......, पन्नासावा, ........, दोनशेवा, ......, पाचशे एकावा ह्या **क्रमवाचक संख्या** आहेत.

#### स्वाध्याय

**(१) चित्र बघा. इंजिनसोडून डबे मोजा. चौकटीत योग्य उत्तर लिहा.**  
*(इंजिन ➔ डबा १: सिंह, डबा २: घोडा, डबा ३: मांजर, डबा ४: ससा, डबा ५: उंदीर)*

* आगगाडीला एकूण किती डबे आहेत ? $\boxed{५}$  
  येथे **५** ही मूल्यवाचक संख्या आहे.
* घोडा कितव्या क्रमांकाच्या डब्यात आहे ? **दुसऱ्या**
* ससा कितव्या क्रमांकाच्या डब्यात आहे ? **चौथ्या**
* तिसऱ्या डब्यात कोणता प्राणी आहे ? **मांजर**
* सिंहाच्या डब्याचा क्रमांक कितवा आहे ? **पहिला**

### [पृष्ठ २४]

**(२) स्थान पाहून उत्तर शोधा.**  
*(संख्यारेषा १ ते १८: १५ व्या स्थानावर राधा, १९ व्या स्थानावर सुधा)*
* एका रांगेत डावीकडून उजवीकडे पाहिल्यास राधाचे १५वे स्थान आहे. तर सुधाचे १९वे स्थान आहे.
* राधापासून सुधाचे स्थान कितवे आहे ? $\boxed{\text{४थे}}$

#### गणिती कोडे

* **कोडे भाग १:**  
  एक होता राजा, त्याला फक्त ९ पर्यंत संख्या मोजता येत होत्या. राजाकडे खूप घोडे होते पण तो मोजू शकत नव्हता. घोड्यांसाठी तबेला बांधलेला होता. त्या घोड्यांना तबेल्यात ठेवणारा त्याचा नोकर रामू होता. रामू त्या घोड्यांना तबेल्यात असे बांधत असे की राजाने प्रत्येक बाजूकडून पाहताना एकूण ९ घोडे दिसत असत.
  $$\begin{array}{|c|c|c|}
  \hline
  ३ & ३ & ३ \\ \hline
  ३ &   & ३ \\ \hline
  ३ & ३ & ३ \\ \hline
  \end{array}$$
  **राजाकडे एकूण घोडे किती होते ?** ➔ $३ \times ८ = \mathbf{२४\text{ \textbf{घोडे}}}$

* **कोडे भाग २:**  
  एके दिवशी एक वाटसरू त्या गावात आला. त्याच्याकडे ४ घोडे होते. अंधार पडला होता. तो वाटसरू रामूला भेटायला गेला. त्याने विचारले की “माझे ४ घोडे आजच्या दिवस तुमच्या तबेल्यात ठेवू शकाल का ?” रामू म्हणाला “नको, कारण आमचा राजा रोज रात्री घोड्यांची मोजणी करतो. तुमच्या घोड्यांना बांधायला माझ्याकडे जागा नाही. राजा तुम्हाला परवानगी देणार नाही.” रामूने त्याला कारणही सांगितले. तो वाटसरू म्हणाला “मी माझे घोडे तुमच्या तबेल्यात असे ठेवतो की राजाला इथे नवीन घोडे आलेत हे कळणारच नाही.”  
  वाटसरूने घोड्यांची रचना अशी केली की, राजाला प्रत्येक कडेने मोजताना एकूण नऊच घोडे दिसत होते.
  $$\begin{array}{|c|c|c|}
  \hline
  २ & ५ & २ \\ \hline
  ५ &   & ५ \\ \hline
  २ & ५ & २ \\ \hline
  \end{array}$$
  **आता एकूण घोडे किती ?** ➔ $(२ \times ४) + (५ \times ४) = ८ + २० = \mathbf{२८\text{ \textbf{घोडे}}}$

* **कोडे भाग ३:**  
  दुसऱ्या दिवशी हुशार वाटसरूने युक्ती केली. त्याने त्याचे ४ घोडे आणि राजाचे ४ घोडे बरोबर घेतले व उरलेले घोडे त्याने असे ठेवले की, प्रत्येक कडेने मोजले तर ९पर्यंत मोजावे लागतील. अशी रचना केल्यामुळे राजाच्या हे लक्षात आले नाही की, वाटसरूने राजाचेही ४ घोडे घेतले आहेत.  
  $$\begin{array}{|c|c|c|}
  \hline
  ४ & १ & ४ \\ \hline
  १ &   & १ \\ \hline
  ४ & १ & ४ \\ \hline
  \end{array}$$
  **आता एकूण घोडे किती ?** ➔ $(४ \times ४) + (१ \times ४) = १६ + ४ = \mathbf{२०\text{ \textbf{घोडे}}}$  
  *(तुम्हाला अशी अजून एखादी रचना करता येते का पाहा.)*

> **शिक्षकांसाठी :** विद्यार्थ्यांना संख्यांवर आधारित विविध प्रकारांची कोडी सोडवण्यास प्रेरित करावे.

### [पृष्ठ २६]

◎ **गौरीने १ किलो सफरचंद व १ किलो चिकू खरेदी केले. तर तिने एकूण किती रुपयांची खरेदी केली ?**  
$$२३५ + ६० = ?$$

* **शतक पाटी, दशक दांडे व सुटे ठोकळे वापरून बेरीज:**
  * १ किलो सफरचंदांची किंमत : २ शतक पाट्या, ३ दशक दांडे, ५ सुटे ठोकळे ($२३५$)
  * १ किलो चिकूंची किंमत : ६ दशक दांडे ($६०$)
  * एकूण किंमत : २ शतक पाट्या ($२००$) $+$ ९ दशक दांडे ($९०$) $+$ ५ सुटे ठोकळे ($५$) $= २९५$

* **आडवी मांडणी करून बेरीज :**
  $$२३५ + ०६० = २९५$$

* **उभी मांडणी करून बेरीज :**

| श | द | ए |
| :-: | :-: | :-: |
| २ | ३ | ५ |
| + | ६ | ० |
| **२** | **९** | **५** |

* **संख्यारेषेच्या मदतीने बेरीज :**  
  $२३५ \xrightarrow{+१०} २४५ \xrightarrow{+१०} २५५ \xrightarrow{+१०} २६५ \xrightarrow{+१०} २७५ \xrightarrow{+१०} २८५ \xrightarrow{+१०} २९५$  
  **गौरीने दुकानदाराकडून एकूण २९५ रुपयांची फळे खरेदी केली.**

> **विचार करा :** वरील फळ खरेदीसाठी गौरीने १०० रुपयांच्या ३ नोटा दुकानदारास दिल्या, तर दुकानदार तिला किती रुपये परत देईल ?

### [पृष्ठ २७]

#### समजून घ्या.
**मीनाने एका दुकानातून एक कंपासपेटी व एक छत्री विकत घेतली, तर तिने दुकानदारास एकूण किती रुपये (रक्कम) दिले ?**

* **दिलेली माहिती :** कंपासपेटीची किंमत = १४५ रुपये, छत्रीची किंमत = ३२० रुपये
* **विचारलेली माहिती :** एकूण किंमत = ?

| श | द | ए | तपशील |
| :-: | :-: | :-: | :--- |
| १ | ४ | ५ | कंपासपेटीची किंमत |
| + ३ | २ | ० | छत्रीची किंमत |
| **४** | **६** | **५** | दुकानदारास दिलेली रक्कम |

* **आडवी मांडणी :** कंपासपेटीची किंमत १४५ $+$ छत्रीची किंमत ३२० $=$ एकूण रक्कम ४६५
* **मीनाने दुकानदारास दिलेली एकूण रक्कम ४६५ रुपये.**

#### कृती करा.

* **१ मिळवा :** ४७६ $\rightarrow$ ४७७ $\rightarrow$ $\boxed{४७८}$ $\rightarrow$ $\boxed{४७९}$
* **२ मिळवा :** ४७६ $\rightarrow$ $\boxed{४७८}$ $\rightarrow$ $\boxed{४८०}$ $\rightarrow$ $\boxed{४८२}$
* **५ मिळवा :** ४७६ $\rightarrow$ $\boxed{४८१}$ $\rightarrow$ $\boxed{४८६}$ $\rightarrow$ ४९१
* **१० मिळवा :** ४७६ $\rightarrow$ $\boxed{४८६}$ $\rightarrow$ $\boxed{४९६}$ $\rightarrow$ $\boxed{५०६}$
* **१०० मिळवा :** ४७६ $\rightarrow$ $\boxed{५७६}$ $\rightarrow$ $\boxed{६७६}$ $\rightarrow$ $\boxed{७७६}$

#### स्वाध्याय

**(१) उभी मांडणी करून बेरीज करा.**

  | :-: | :-: | :-: |

  | + | | ४ |
  | **३** | **२** | **५** |

  | २ | ६ | ७ |

  | श | द | ए |
  | :-: | :-: | :-: |

  | **७** | **१** | **९** |

**(३) दिलेले अंक एकदाच वापरून सर्वांत मोठी तीन अंकी संख्या व सर्वांत लहान तीन अंकी संख्या तयार करा व त्या संख्यांची बेरीज करा.**
* **२, ४, ३ :** मोठी संख्या = ४३२, लहान संख्या = २३४ ➔ $४३२ + २३४ = \mathbf{६६६}$
* **४, ५, १ :** मोठी संख्या = ५४१, लहान संख्या = १४५ ➔ $५४१ + १४५ = \mathbf{६८६}$
* **७, २, ० :** मोठी संख्या = ७२०, लहान संख्या = २०७ ➔ $७२० + २०७ = \mathbf{९२७}$
* **६, ४, ३ :** मोठी संख्या = ६४३, लहान संख्या = ३४६ ➔ $६४३ + ३४६ = \mathbf{९८९}$

#### बेरीज हातच्याची

  * प्रथम ८ व ७ या एककांची बेरीज करू. एककांची बेरीज १५ आली.

| :-: | :-: | :-: |

| २ | १ | २ |
| + ३ | ८ | ६ |

### [पृष्ठ २९]

#### स्वाध्याय

**(१) बेरीज करा.**

**(२) खालील उदाहरणे सोडवा.**
* **उदा. १ :** एका ग्रंथालयात ३८१ पुस्तके होती. सुभाषने ५१ पुस्तके ग्रंथालयास भेट म्हणून दिली, तर ग्रंथालयात आता एकूण किती पुस्तके झाली ?  
  $$३८१ + ५१ = \mathbf{४३२\text{ \textbf{पुस्तके}}}$$
* **उदा. २ :** एका शेतात आंब्याची ४७८ आणि चिकूची २५६ झाडे आहेत, तर त्या शेतात एकूण किती झाडे आहेत ?  
  $$४७८ + २५६ = \mathbf{७३४\text{ \textbf{झाडे}}}$$

◎ **दिलेल्या माहितीच्या आधारे बेरजेचे शाब्दिक उदाहरण तयार करून सोडवा.**
* **माहिती :** कामगार ३५२, नवीन कामगार १८७
* **तयार केलेले उदाहरण :** एका कारखान्यात ३५२ कामगार आहेत. त्यात १८७ नवीन कामगारांची भरती झाली तर कारखान्यात एकूण कामगारांची संख्या किती होईल ?
  | श | द | ए | तपशील |
  | :-: | :-: | :-: | :--- |
  | **१** | | | हातचा |
  | ३ | ५ | २ | कामगार |
  | + १ | ८ | ७ | नवीन कामगार |
  | **५** | **३** | **९** | एकूण कामगार |
  कारखान्यात एकूण $\boxed{५३९}$ कामगार होतील.

#### स्वाध्याय : दिलेल्या माहितीवरून उदाहरण तयार करा व सोडवा.
* **टोपलीत - आंबे ३५, पेरू ४८ आणि चिकू २४.**  
  *उदाहरण :* एका टोपलीत ३५ आंबे, ४८ पेरू आणि २४ चिकू आहेत, तर टोपलीत एकूण किती फळे आहेत ?  
  *उत्तर :* $३५ + ४८ + २४ = \mathbf{१०७\text{ \textbf{फळे}}}$
* **कपडे - शर्टची किंमत ३९९, पॅन्टची किंमत ४९९.**  
  *उदाहरण :* एका दुकानातून ३९९ रुपयांचा शर्ट आणि ४९९ रुपयांची पॅन्ट खरेदी केली, तर एकूण किती रुपये खर्च झाले ?  
  *उत्तर :* $३९९ + ४९९ = \mathbf{८९८\text{ \textbf{रुपये}}}$
* **शाळेत - इयत्ता तिसरी १३४ विद्यार्थी, इयत्ता चौथी १४३ विद्यार्थी, इयत्ता पाचवी १३९ विद्यार्थी.**  
  *उदाहरण :* एका प्राथमिक शाळेत इयत्ता तिसरीत १३४, चौथीत १४३ आणि पाचवीत १३९ विद्यार्थी शिकत आहेत, तर त्या तिन्ही इयत्तांचे मिळून एकूण किती विद्यार्थी आहेत ?  
  *उत्तर :* $१३४ + १४३ + १३९ = \mathbf{४१६\text{ \textbf{विद्यार्थी}}}$

### [पृष्ठ ३०]

**समजून घ्या.**

| पॅन्ट | ₹ ४९९ |
| कॅरम बोर्ड | ₹ २४० |
| टीशर्ट | ₹ ४७० |

#### वजाबाकी (हातच्याची / उसण्याची)

**समजून घ्या.**

◎ **यशने एक कॅरमबोर्ड व एक बुद्धिबळ संच विकत घेतला, तर यशने एकूण किती रुपयांची खरेदी केली ?**
$$२४०\text{ रुपये} + ३५०\text{ रुपये} = \mathbf{५९०\text{ \textbf{रुपये}}}$$
यशने **५९०** रुपयांची खरेदी केली.

यशच्या लक्षात आले की त्याची खरेदी ५०० रुपयांपेक्षा जास्त झाली आहे म्हणून यशने दुकानदारास त्याच्याजवळील ५०० रुपयांची एक नोट व २०० रुपयांची एक नोट असे ७०० रुपये दिले, तर दुकानदार त्याला किती रुपये परत देईल ?
$$७०० - ५९० = \text{किती ?}$$

* **पायऱ्या :**
  1. प्रथम एककातून एकक वजा करू : $० - ० = ०$.
  2. आता ० दशकांतून ९ दशक वजा होत नाहीत म्हणून ७ शतकांतील एक शतक मोकळा केला, त्याचे १० दशक झाले. या १० दशकांतून ९ दशक वजा केले ($१० - ९ = १$).
  3. उरलेल्या ६ शतकांतून ५ शतक वजा केले ($६ - ५ = १$).
  4. **दुकानदार यशला ११० रूपये परत देईल.**

| श | द | ए |
| :-: | :-: | :-: |
| ६ | १० | |
| ७ | ० | ० |
| - ५ | ९ | ० |
| **१** | **१** | **०** |

◎ **संख्यारेषेच्या मदतीने वजाबाकी दर्शवणे :**  
$७०० \xrightarrow{-१००} ६०० \xrightarrow{-१०} ५९०$  
$१० + १०० = ११०\text{ रुपये}$. दुकानदाराने यशला ११० रुपये परत दिले.

> **शिक्षकांसाठी :** बेरजेच्या व वजाबाकीच्या उदाहरणांचा सराव घ्यावा. गणित पेटीतील नोटांचा उपयोग करून प्रत्यक्ष व्यवहार घडवून आणावा.

**(६) आईजवळ ७०० रुपये होते. तिने २४५ रुपयांची साखर आणि १२८ रुपयांची चहा पावडर विकत घेतली तर तिच्याजवळ किती रुपये शिल्लक राहिले ? रिकाम्या जागा भरून कृती पूर्ण करा.**

* चहा पावडरसाठी $\boxed{१२८}$ रुपये दिले.

* आईजवळ $\boxed{७००}$ रुपये होते.
* आईजवळ शिल्लक रक्कम : $७०० - ३७३ = \boxed{३२७}$ रुपये शिल्लक राहिले.

**(७) एका दूध संकलन केंद्रात आधी ६२४ लीटर दूध जमा होते. शेतकऱ्यांकडून आणखी ३४७ लीटर दूध जमा करण्यात आले. त्यामधील ५१२ लीटर दूध उपाहारगृह चालकांना व ३४६ लीटर दूध इतर ग्राहकांना दिले. तर दूध संकलन केंद्रात किती लीटर दूध शिल्लक राहिले ?**

* एकूण वाटप केलेले दूध : $५१२ + ३४६ = ८५८\text{ लीटर}$
* शिल्लक दूध : $९७१ - ८५८ = \mathbf{११३\text{ \textbf{लीटर}}}$

### [पृष्ठ ३५]

#### बेरीज-वजाबाकी सहसंबंध

◎ **खालील चौकटीत योग्य संख्या लिहा.**
$$५ + ४ = ९$$
$$४ + ५ = ९$$
$$९ - ४ = ५$$
$$९ - ५ = ४$$

> दोन संख्यांची बेरीज केली असता येणाऱ्या उत्तरातून त्यातील एक संख्या वजा केली असता दुसरी संख्या मिळते.

#### स्वाध्याय

**(१) सोडवा.**
* $२६ + \boxed{४१} = ६७ \longrightarrow \boxed{६७} - ४१ = २६ \longrightarrow \boxed{४१} + २६ = ६७ \longrightarrow ६७ - \boxed{२६} = ४१$
* $२३७ + \boxed{३२०} = ५५७$
* $३५८ + \boxed{३८५} = ७४३$
* $\boxed{५८७} - ४३६ = १५१$
* $९६७ - \boxed{४३२} = ५३५$
* $३४२ - \boxed{१२९} = २१३$

**(२) खालील कोडे सोडवा.**
* १२० $\xrightarrow{+३}$ $\boxed{१२३}$ $\xrightarrow{+३३}$ १५६ $\xrightarrow{+१९}$ $\boxed{१७५}$
* $\boxed{११३}$ $\xleftarrow{-७}$ १२० $\xleftarrow{-१०}$ १३० $\xleftarrow{-४५}$ १७५
* $\boxed{११३} \xrightarrow{+१७} १३०$

### [पृष्ठ ३६]

**(३) जवळचे शतक लिहा.**

| संख्या | बेरीज / वजाबाकी | जवळचे शतक |
| :--- | :---: | :---: |
| १७८ + २४ | २०२ | **२००** |
| १३४ - ५६ | ७८ | **१००** |
| ४५७ + ६७ | ५२४ | **५००** |
| ८६३ - १५६ | ७०७ | **७००** |

**(४) पुढील जोडीमध्ये ज्याचे उत्तर जास्त असेल त्याभोवती वर्तुळ करा.**
* **( ३५२ + १४ )** / ३५२ - १४
* ४५६ + २० / **( ४३६ + ५० )**  *(कारण ४५६+२० = ४७६; ४३६+५० = ४८६)*
* ६५४ + २७ / **( ५९८ + ६७ )**  *(कारण ६५४+२७ = ६८१; ५९८+६७ = ६६५ ➔ ६८१ मोठे)*
* ९६७ - १२ / **( ८९७ + ६६ )**  *(कारण ९६७-१२ = ९५५; ८९७+६६ = ९६३)*

**(५) सारखे उत्तर असलेल्या जोड्या शोधा.**
* $२५६ + २९२ = \mathbf{५४८}$ $\longleftrightarrow$ $२५९ + २८९ = \mathbf{५४८}$
* $८१३ - २३७ = \mathbf{५७६}$ $\longleftrightarrow$ $७१९ - १४३ = \mathbf{५७६}$
* $४६२ + १०६ = \mathbf{५६८}$ $\longleftrightarrow$ $९१६ - ३४८ = \mathbf{५६८}$

### [पृष्ठ ३७]

**विनामूल्य वितरणासाठी**

#### संवाद : अपूर्णांकांची सुरुवात
* **पिहू :** "दादा, इकडे ये ! आईने खायला एक लाडू दिला आहे."
* **दादा :** "अरे वाह ! लाडू मला खूप आवडतो."
* **दादा :** "पिहू आण इकडे, मी करतो दोन भाग"
* **पिहू :** "नुसते दोन भाग नाही दादा ! मी दोन **समान** भाग करते."

#### विचार करा.
(१) पिहूने एका लाडूचे दोन समान भाग केले.  
(२) भाकरीचे दोन समान भाग करणे व लाडवाचे दोन समान भाग करणे यातील कोणते काम तुम्हांला सोपे वाटते ? कशामुळे ते सांगा.

---

#### अर्धा

**समजून घ्या.**

◎ **एका वर्तुळाकार कागदाचे दोन समान भाग करा.**
1. एक वर्तुळाकार कागद घ्या.
2. घडी घाला.
3. घडी उघडा, घडीच्या रेषेवरून कापा.
4. दोन समान भाग तयार होतील. हा प्रत्येक भाग म्हणजे पूर्ण वर्तुळाचा **अर्धा भाग**.

> **मला समजले :**  
> कोणत्याही एका आकाराचे, वस्तूचे किंवा समूहाचे म्हणजेच एक पूर्णचे दोन समान भाग केल्यास, त्यांतील प्रत्येक भाग हा त्या आकाराचा, वस्तूचा किंवा समूहाचा अर्धा भाग असतो. **अर्धा म्हणजे निम्मा होय.**

#### स्वाध्याय

**(१) खालीलपैकी ज्या आकाराचे तुटक रेषेमुळे दोन समान भाग झालेले दिसतात, त्या आकाराखाली दिलेल्या चौकटीत $\checkmark$ अशी खूण करा.**
* वर्तुळ (व्यासावरून मधोमध रेषा) ➔ $\boxed{\checkmark}$
* समद्विभुज त्रिकोण (उभी मध्यगा रेषा) ➔ $\boxed{\checkmark}$
* दिवा / पणती (उभी मध्यभागी रेषा) ➔ $\boxed{\checkmark}$
* चौरस (कर्णावर तिरकी रेषा) ➔ $\boxed{\checkmark}$
* पंचकोन (असममित आडवी रेषा) ➔ $\boxed{\phantom{\checkmark}}$ *(समान भाग नाहीत)*

---

### [पृष्ठ ३८]

**(२) उर्वरित अर्धा भाग काढून आकृती पूर्ण करा.**  
*(डॉट ग्रीडवर तीन अपूर्ण आकृत्यांचे अर्धे भाग दिलेले आहेत, सममिती रेषेच्या पलीकडे दुसरा अर्धा भाग काढून आकृती पूर्ण करणे.)*

#### कृती करा.
(१) A पासून Z पर्यंतच्या इंग्लिश मोठ्या लिपीतील कोणत्या अक्षरांचे आपल्याला दोन समान भाग करता येतील ?  
*(उदा. A, B, C, D, E, H, I, K, M, O, T, U, V, W, X, Y)*  
(२) वर्तुळ, चौरस, त्रिकोण आकारांचे कागद घेऊन, घड्या घालून वेगवेगळ्या किती प्रकारे दोन समान भाग करता येतात ते प्रत्यक्ष करून बघा.

---

#### पाव

**समजून घ्या.**

◎ **मेघनाकडे एक भाकरी आहे. तिने त्या भाकरीचे चार समान भाग केले.**
* **पूर्ण :** पूर्ण भाकरी
* **अर्धा \| अर्धा :** भाकरीचे २ समान भाग
* **पाव \| पाव :** अर्ध्या भाकरीचे २ समान भाग
* **पाव \| पाव \| पाव \| पाव :** पूर्ण भाकरीचे चार समान भाग
* भाकरीचे चार समान भाग केले. यांतील प्रत्येक भाग हा **एक पूर्णचा पाव भाग**.
* **अर्ध्याचा अर्धा भाग म्हणजे पाव भाग.**

> **मला समजले :**  
> एका वस्तूचे किंवा आकाराचे चार समान भाग केल्यास त्यांतील प्रत्येक भाग हा ‘पाव’ भाग असतो.  
> दोन पाव भाग मिळून तयार होणारा भाग म्हणजे अर्धा भाग.

#### स्वाध्याय

◎ **खालील आकारांचे पाव भाग रंगवा.**
1. समभुज चौकोन (४ समान त्रिकोणांपैकी १ त्रिकोण रंगवणे)
2. आयताकार रचना (४ समान भागांपैकी १ भाग रंगवणे)
3. चार पाकळ्यांचे फूल (४ पाकळ्यांपैकी १ पाकळी रंगवणे)
4. षटकोन (४ समान भागांपैकी १ भाग रंगवणे)

> **शिक्षकांसाठी :** विविध आकारांचे कागद देऊन त्यांचे चार समान भाग करण्याची कृती विद्यार्थ्यांकडून करून घ्यावी. विद्यार्थ्यांना प्रत्यक्ष अनुभवातून अपूर्णांक समजून घेण्याची संधी उपलब्ध करून द्यावी.

### [पृष्ठ ३९]

#### पाऊण

**समजून घ्या.**

> वेळ झाली जेवणाची,  
> पोळी केली पुरणाची.  
> पिहूला लागली भूक फार,  
> पोळीचे केले समान भाग चार.  
> पिहूने खाल्ले तीन पाव भाग,  
> उरला फक्त पाव भाग.

> **मला समजले :**  
> * एका वस्तूचे किंवा आकाराचे चार समान भाग करून त्यातील तीन भाग घेतल्यास तो **पाऊण भाग** असतो.  
> * अर्धा भाग व पाव भाग मिळून पाऊण भाग होतो.  
> * एका पूर्णमधून पाव भाग कमी केला की पाऊण भाग मिळतो.  
> * तीन पाव भाग मिळून तयार होणारा भाग म्हणजे पाऊण भाग.

◎ **रंगवलेला भाग : पाव ते पूर्ण.**

| रंगवलेला भाग | भागाचे नाव |
| :---: | :---: |
| वर्तुळाचा १/४ भाग रंगवलेला | **१ पाव = पाव** |
| वर्तुळाचा २/४ भाग रंगवलेला | **२ पाव = अर्धा** |
| वर्तुळाचा ३/४ भाग रंगवलेला | **३ पाव = पाऊण** |
| वर्तुळाचा ४/४ भाग रंगवलेला | **४ पाव = एक पूर्ण** |

> **शिक्षकांसाठी :** गणितातील संकल्पनांवर आधारित गाणी तयार करून, त्यांचे तालासुरात साभिनय सादरीकरण घ्यावे.

---

### [पृष्ठ ४०]

#### स्वाध्याय

**(१) पाऊण भाग रंगवलेला आहे त्या आकृतीखालील चौकटीत $\checkmark$ खूण करा. नसेल तर $\times$ खूण करा.**
* ४ समान पट्ट्यांपैकी ३ पट्ट्या रंगवलेला आयत ➔ $\boxed{\checkmark}$
* ३ समान पट्ट्यांपैकी २ पट्ट्या रंगवलेला आयत ➔ $\boxed{\times}$
* ४ समान भागांपैकी ३ भाग रंगवलेला अधिक (+) आकार ➔ $\boxed{\checkmark}$
* कर्णांनी ४ भाग केलेल्या चौरसातील २ भाग रंगवलेले ➔ $\boxed{\times}$

**(२) खालील सारणी पूर्ण करा.**

| आकृती | रंगवलेला भाग | न रंगवलेला भाग |
| :--- | :---: | :---: |
| वर्तुळ (४ पैकी १ भाग रंगवला) | पाव | **पाऊण** |
| आयत (४ पैकी २ भाग रंगवले) | **अर्धा** | अर्धा |
| चौरस (४ पैकी ३ भाग रंगवले) | **पाऊण** | **पाव** |
| समांतरभुज चौकोन (४ पैकी १ भाग रंगवला) | **पाव** | पाऊण |
| आवरग्लास आकार (४ पैकी २ भाग रंगवले) | अर्धा | **अर्धा** |

**(३) आकृतीच्या खाली दिलेल्या भागाएवढा भाग रंगवा.**
* चार टोकांचा तारा (४ भाग) : **पाऊण** (३ भाग रंगवणे)
* त्रिकोण (४ लहान त्रिकोण) : **पाव** (१ लहान त्रिकोण रंगवणे)
* षटकोन (२ भाग) : **अर्धा** (१ भाग रंगवणे)
* चौरस (४ भाग) : **निम्मा** (२ भाग रंगवणे)
* क्रॉस आकार (४ भाग) : **३ पाव** (३ भाग रंगवणे)

**(४) अक्षराच्या खाली दिलेला भाग दाखवण्यासाठी रेषा काढा. अक्षराचा तेवढाच भाग रंगवा.**
* **I** : निम्मा (मधोमध आडवी रेषा काढून अर्धा भाग रंगवणे)
* **B** : अर्धा (मधोमध आडवी रेषा काढून खालचा/वरचा अर्धा भाग रंगवणे)
* **O** : पाऊण (४ भागांपैकी ३ भाग रंगवणे)
* **H** : पाव (४ भागांपैकी १ भाग रंगवणे)

### [पृष्ठ ४१]

#### दिलेल्या समूहाचा अर्धा, पाव, पाऊण

**विनामूल्य वितरणासाठी**

#### कृती करा.
◎ **खालील समूहांचा विचार करून सुचवलेला भाग रंगवा.**
(१) या चित्रात दिलेल्या मण्यांच्या माळेतील निम्मे मणी लाल रंगाने व निम्मे मणी काळ्या रंगाने रंगवा.  
*(एकूण २० मणी ➔ १० मणी लाल, १० मणी काळे)*  
(२) चित्रात दिलेल्या फुग्यांपैकी पाव भाग फुगे पिवळ्या रंगाने रंगवा.  
*(एकूण ८ फुगे ➔ २ फुगे पिवळे)*  
(३) चित्रात दिलेल्या गोट्यांपैकी पाऊण भाग गोट्यांना निळ्या रंगाने रंगवा.  
*(एकूण १२ गोट्या ➔ ९ गोट्या निळ्या)*

#### स्वाध्याय

**(१) एंजलने १ डझन केळी आणली. त्यातील अर्धा डझन केळी मैत्रिणीला दिली, तर तिच्याकडे किती केळी शिल्लक राहिली ?**
* १२ केळी $\rightarrow$ मैत्रिणीला ६ केळी दिली $\rightarrow$ शिल्लक राहिली $\boxed{६}$ केळी.

* **किती ते लिहा :**
  * १ डझन = १२ केळी
  * अर्धा डझन = $\boxed{६}$ केळी
  * पाव डझन = $\boxed{३}$ केळी
  * पाऊण डझन = $\boxed{९}$ केळी

**(२) एका वर्षात १२ महिने असतात, तर:**
* अर्ध्या वर्षात किती महिने असतात ? $\boxed{६}$
* पाव वर्षात किती महिने असतात ? $\boxed{३}$

**(३) सोडवा.**

* **घड्याळ वाचन (६० मिनिटे):**
  * १ तास = ६० मिनिटे
  * अर्धा तास = $\boxed{३०}$ मिनिटे
  * पाव तास = $\boxed{१५}$ मिनिटे
  * पाऊण तास = $\boxed{४५}$ मिनिटे

* **किती ते लिहा :**
  * ६० चा अर्धा = $\boxed{३०}$
  * ६० चा पाव = $\boxed{१५}$
  * ६० चा पाऊण = $\boxed{४५}$

> **शिक्षकांसाठी :** समूहातील दिलेल्या भागानुसार अर्धा, पाव, पाऊण भागाएवढ्या वस्तू रंगवून यांवर चर्चा घडवून आणावी. समूहाचे २ सारखे भाग करून अर्धा, तर ४ सारखे भाग करून पाव तसेच अर्धा आणि पाव मिळवून पाऊण भाग मिळवणे. अशा विविध उदाहरणांद्वारे पुरेसा सराव घ्यावा.

---

### [पृष्ठ ४२]

**(४) सोडवा.**

* **किती ते लिहा :**
  * १०० चा अर्धा = $\boxed{५०}$
  * १०० चा पाव = $\boxed{२५}$
  * १०० चा पाऊण = $\boxed{७५}$

* **जोड्या जुळवा :**
  * १२ चा अर्धा $\longrightarrow$ **६**
  * १०० चा पाव $\longrightarrow$ **२५**
  * ८० चा पाऊण $\longrightarrow$ **६०**

* **रिकाम्या जागा भरा :**
  * १५ मिनिटे म्हणजे = $\boxed{\text{पाव}}$ तास
  * ३ केळी म्हणजे = $\boxed{\text{पाव}}$ डझन केळी
  * १०० धावा = $\boxed{१}$ शतक

#### निमपट आणि दुप्पट

**समजून घ्या.**

* **मुलगा १ :** "माझ्याकडे ४ गोट्या आहेत. माझ्याकडे तुझ्या गोट्यांच्या **निमपट** गोट्या आहेत." (४ गोट्या)
* **मुलगा २ :** "माझ्याकडे ८ गोट्या आहेत. माझ्याकडे तुझ्या गोट्यांच्या **दुप्पट** गोट्या आहेत. ८ गोट्यांचे दोन समान गट केले आहेत." (४ + ४ = ८)

> **मला समजले :**  
> * **निमपट** म्हणजे समूहाचा अर्धा होय.  
> * **दुप्पट करणे** म्हणजे संख्येला २ ने गुणणे होय.

#### स्वाध्याय

**(१) दुप्पट आणि निमपट हे शब्द वापरून खालील रिकाम्या जागा भरा.**  
राजू आणि मीना दोरी उड्या खेळत होते. राजूने १० उड्या मारल्या. मीनाने २० उड्या मारल्या.
* १० उड्या या २० उड्यांच्या $\boxed{\text{निमपट}}$ आहेत.
* २० उड्या, या १० उड्यांच्या $\boxed{\text{दुप्पट}}$ आहेत.

**(२) रिकाम्या चौकटीत योग्य संख्या लिहा.**
* तिसरीच्या एका वर्गात ३० विद्यार्थी आहेत. त्यातील निम्म्या विद्यार्थ्यांनी धावण्याच्या शर्यतीत भाग घेतला, म्हणजे किती जणांनी धावण्याच्या शर्यतीत भाग घेतला ? $\boxed{१५}$ विद्यार्थी
* बाबांनी गहू व तांदूळ आणले. गव्हाचे वजन तांदळाच्या वजनाच्या दुप्पट आहे. जर तांदळाचे वजन ५ किलोग्रॅम आहे. तर गव्हाचे वजन किती किलोग्रॅम आहे ? $\boxed{१०}$ किलोग्रॅम
* सचिनच्या वडिलांनी अर्धा डझन वह्या आणल्या. त्यातील निम्म्या वह्या ताईला दिल्या. उरलेल्या वह्या सचिनला दिल्या, तर सचिनला किती वह्या मिळाल्या ? $\boxed{३}$ वह्या
* अजयकडे असलेल्या रकमेचा पाव भाग १० रुपये आहे. तर त्याच्याकडे एकूण किती रुपये आहेत ? $\boxed{४०}$ रुपये

### [पृष्ठ ४३]

#### अपूर्णांकाचे वाचन व लेखन

**समजून घ्या.**

| आकृती | भाग | संख्यारूपात लेखन |
| :---: | :---: | :---: |
| ०००० | ४ पूर्ण | ४ |
| ०० | २ पूर्ण | २ |
| ० | १ पूर्ण | १ |
| ◑ | एक पूर्णचा अर्धा भाग | $\frac{१}{२}$ |

* **दादा :** "मेघना, या तक्त्यातील शेवटची आकृती एका पूर्ण आकृतीचा किती भाग आहे ?"
* **मेघना :** "अर्धा भाग आहे."
* **दादा :** "मेघना, ‘अर्धा’ भाग हा अपूर्ण भाग आहे. तसेच पाव व पाऊण हेसुद्धा अपूर्ण भाग आहेत."
* **मेघना :** "दादा, हा ‘अर्धा’ भाग संख्यारूपात कसा लिहायचा ? आणि मी ते कसे वाचू ? सांग बरं."
* **दादा :**
  $$\frac{\text{विचारात घेतलेले (रंगवलेले भाग) (अंश)}}{\text{एक पूर्णचे केलेले एकूण समान भाग (छेद)}} = \frac{१}{२}$$
  > **$\frac{१}{२}$ चे वाचन ‘एक छेद दोन’ किंवा ‘एक अंश छेद दोन’ असे करतात.**
* **मेघना :** "इतकं सोप्पं ! समजलं की !"

---

**(१) अपूर्णांक संख्यारूपात कसा लिहावा ?**  
*(५ समान भागांपैकी ४ भाग रंगवलेली पट्टी)*
$$\frac{\text{रंगवलेले भाग}}{\text{एक पूर्णचे केलेले एकूण समान भाग}} = \frac{\text{अंश}}{\text{छेद}} = \frac{४}{५}$$
**$\frac{४}{५}$ चे वाचन ‘चार छेद पाच’ असे करतात.**

**(२) ‘पाव’ संख्यारूपात कसा लिहावा ?**  
*(४ समान भागांपैकी १ भाग रंगवलेले वर्तुळ)*
$$\frac{\text{रंगवलेले भाग (अंश)}}{\text{एक पूर्णचे केलेले एकूण समान भाग (छेद)}} = \frac{१}{४}$$
**$\frac{१}{४}$ चे वाचन ‘एक छेद चार’ असे करतात.**

**(३) ‘पाऊण’ संख्यारूपात कसा लिहावा ?**  
*(४ समान भागांपैकी ३ भाग रंगवलेले वर्तुळ)*
$$\frac{\text{रंगवलेले भाग (अंश)}}{\text{एक पूर्णचे केलेले एकूण समान भाग (छेद)}} = \frac{३}{४}$$
**$\frac{३}{४}$ चे वाचन ‘तीन छेद चार’ किंवा ‘तीन अंश छेद चार’ असे करतात.**

**(४) रिकाम्या जागा भरून अपूर्णांक संख्यारूपात लिहा.**  
*(८ समान भागांपैकी ३ भाग रंगवलेला आयत)*
$$\frac{\text{रंगवलेले भाग}}{\text{एक पूर्णचे केलेले एकूण समान भाग}} = \frac{\text{अंश}}{\text{छेद}} = \frac{\boxed{३}}{\boxed{८}}$$
**$\frac{३}{८}$ चे वाचन ‘तीन छेद आठ’ असे करतात.**

### [पृष्ठ ४४]

#### स्वाध्याय

**(१) पुढील सारणी पूर्ण करा.**

| आकृती | समान भागांपैकी रंगवलेले भाग | केलेले एकूण समान भाग | अंश | छेद | लेखन | वाचन |
| :---: | :---: | :---: | :---: | :---: | :---: | :---: |
| त्रिकोण (४ लहान त्रिकोण, ३ रंगवले) | ३ | ४ | ३ | ४ | $\frac{३}{४}$ | तीन छेद चार |
| चौरस (४ चौरस, २ रंगवले) | २ | ४ | २ | ४ | $\frac{२}{४}$ | दोन छेद चार |
| वर्तुळ (२ भाग, १ रंगवला) | $\boxed{१}$ | २ | $\boxed{१}$ | $\boxed{२}$ | $\boxed{\frac{१}{२}}$ | एक छेद दोन |
| आयत (५ भाग, ३ रंगवले) | ३ | $\boxed{५}$ | $\boxed{३}$ | ५ | $\frac{३}{५}$ | तीन छेद पाच |
| वर्तुळ (६ भाग, ४ रंगवले) | ४ | ६ | $\boxed{४}$ | $\boxed{६}$ | $\boxed{\frac{४}{६}}$ | चार छेद सहा |
| षटकोन (६ भाग, २ रंगवले) | २ | $\boxed{६}$ | $\boxed{२}$ | $\boxed{६}$ | $\boxed{\frac{२}{६}}$ | दोन छेद सहा |

◎ **अंश आणि छेद यांचे निरीक्षण करा व त्यांची तुलना करा.**
* १ पाव = ‘पाव’ = $\left(\frac{१}{४}\right)$
* २ पाव = ‘अर्धा’ = $\left(\frac{२}{४}\right)$
* ३ पाव = ‘पाऊण’ = $\left(\frac{३}{४}\right)$
* ४ पाव = ‘एक पूर्ण’ = $\left(\frac{४}{४}\right)$

> **मला समजले :**  
> * अर्धा, पाव, पाऊण या तिन्ही अपूर्णांकांत छेदापेक्षा अंश लहानच असतो.  
> * **अंश आणि छेद समान झाले की एक पूर्ण होतो.**

---

### [पृष्ठ ४५]

#### एकक अपूर्णांक

**समजून घ्या.**

* पूर्ण वर्तुळ $\rightarrow$ ४ समान भाग केले $\rightarrow$ ४ पाव भाग झाले.  
  प्रत्येक भाग $\frac{१}{४}$ आहे.  
  या ठिकाणी $\frac{१}{४}$ हा अपूर्णांक चार वेळा घेतला की एक पूर्ण होतो.  
  **म्हणून या पूर्णबाबत येथे $\frac{१}{४}$ हा एकक अपूर्णांक आहे.**

* **जास्वंदीचे फूल :**  
  येथे एका फुलाच्या ५ पाकळ्यांपैकी २ पाकळ्या रंगवल्या आहेत.  
  येथे रंगवलेला भाग $\frac{२}{५}$ हा अपूर्णांक दर्शवतो.  
  एका पूर्णचे ५ समान भाग केले. त्यातील प्रत्येक भाग $\frac{१}{५}$ आहे. येथे $\frac{१}{५}$ हा एकक अपूर्णांक आहे.  
  **$\frac{२}{५}$ याचा अर्थ $\frac{१}{५}$ हा एकक अपूर्णांक २ वेळा घेतला आहे.**

---

#### अंशाधिक व छेदाधिक अपूर्णांक

**चर्चा करा.**
* अपूर्णांकात छेद हा अंशापेक्षा नेहमी मोठाच असतो का ?
* जर अंश छेदाच्या दुप्पट असेल, तर तो अपूर्णांक असेल की पूर्ण होईल ?

◎ **एक पूर्ण चा पाव भाग आहे. असे पाव भाग अनेक वेळा घेतले आहेत त्याचे निरीक्षण करा.**
* १ पाव तुकडा ➔ $\frac{१}{४}$ (एकक अपूर्णांक)
* २ पाव तुकडे ➔ $\frac{२}{४}$ ($\frac{१}{४}$ दोन वेळा)
* ३ पाव तुकडे ➔ $\frac{३}{४}$ ($\frac{१}{४}$ तीन वेळा)
* ४ पाव तुकडे ➔ $\frac{४}{४}$ ($\frac{१}{४}$ चार वेळा = १ पूर्ण)
* ५ पाव तुकडे ➔ $\frac{५}{४}$ ($\frac{१}{४}$ पाच वेळा)

> **शिक्षकांसाठी :** चित्र, ठिपके, रेषा, वस्तूंचा समूह इत्यादींचा उपयोग करून अर्धा, पाव, पाऊण संबंधित उदाहरणे सोडवण्याची विद्यार्थ्यांना संधी द्यावी. अर्धा, पाव, पाऊण, निमपट, दुप्पट या संबोधाशी निगडीत व्यावहारिक उदाहरणे स्वतः तयार करण्यासाठी विद्यार्थ्यांना वाव द्यावा. आवश्यकतेनुसार मित्र, पालक यांचे सहकार्य घेण्यास सुचवावे.

---

### [पृष्ठ ४६]

> **मला समजले :**  
> * आपण कोणताही एकक अपूर्णांक कितीही वेळा घेऊ शकतो.  
>   जसे ३ वेळा $\frac{१}{४}$ म्हणजे $\frac{३}{४}$, ७ वेळा $\frac{१}{४}$ म्हणजे $\frac{७}{४}$  
> * $\frac{१}{४}, \frac{२}{४}, \frac{३}{४}$ या अपूर्णांकांमध्ये अंशांपेक्षा छेद मोठे आहेत, म्हणून हे **छेदाधिक अपूर्णांक** आहेत.  
> * $\frac{५}{४}, \frac{६}{४}, \frac{७}{४}$ या अपूर्णांकांमध्ये छेदांपेक्षा अंश मोठे आहेत. म्हणून हे **अंशाधिक अपूर्णांक** आहेत.  
> * **ज्या अपूर्णांकांमध्ये अंशांपेक्षा छेद मोठे असतात ते अपूर्णांक ‘छेदाधिक अपूर्णांक’ असतात.**  
>   जसे $\frac{१}{२}, \frac{१}{४}, \frac{३}{४}, \frac{५}{९}, \frac{११}{१४}$ ..........  
> * **ज्या अपूर्णांकांमध्ये छेदांपेक्षा अंश मोठे असतात ते अपूर्णांक ‘अंशाधिक अपूर्णांक’ असतात.**  
>   जसे $\frac{५}{४}, \frac{७}{२}, \frac{६}{५}, \frac{१३}{९}, \frac{१९}{११}$ ........

#### स्वाध्याय

**(१) खालील अपूर्णांकांचे अंशाधिक अपूर्णांक आणि छेदाधिक अपूर्णांक असे गट करा.**  
$$\frac{३}{५},\quad \frac{२}{६},\quad \frac{६}{५},\quad \frac{३}{८},\quad \frac{५}{४},\quad \frac{७}{९},\quad \frac{४}{३}$$

* **अंशाधिक अपूर्णांक :** $\frac{६}{५},\quad \frac{५}{४},\quad \frac{४}{३}$
* **छेदाधिक अपूर्णांक :** $\frac{३}{५},\quad \frac{२}{६},\quad \frac{३}{८},\quad \frac{७}{९}$

**(२) छेदाचा विचार करून अंशस्थानी अशी संख्या लिहा की तो अपूर्णांक अंशाधिक होईल.**  
*(अंश छेदापेक्षा मोठा असणे आवश्यक आहे)*  
$$\frac{\boxed{५}}{४},\quad \frac{\boxed{७}}{५},\quad \frac{\boxed{४}}{३},\quad \frac{\boxed{९}}{७},\quad \frac{\boxed{३}}{२},\quad \frac{\boxed{६}}{४}$$

**(३) अंशाचा विचार करून छेदस्थानी अशी संख्या लिहा की तो अपूर्णांक छेदाधिक होईल.**  
*(छेद अंशापेक्षा मोठा असणे आवश्यक आहे)*  
$$\frac{१}{\boxed{३}},\quad \frac{४}{\boxed{७}},\quad \frac{२}{\boxed{५}},\quad \frac{५}{\boxed{८}},\quad \frac{३}{\boxed{६}},\quad \frac{६}{\boxed{११}}$$

**(४) अंशाधिक अपूर्णांक तयार होण्यासाठी रिकाम्या चौकटीत योग्य संख्या लिहा.**  
$$\frac{\boxed{१८}}{१७},\quad \frac{३७}{\boxed{२५}},\quad \frac{५९}{\boxed{५०}},\quad \frac{३}{\boxed{२}},\quad \frac{\boxed{८}}{\boxed{५}}$$

> **शिक्षकांसाठी :** गणित पेटीतील साहित्याच्या आधारे अंशाधिक व छेदाधिक अपूर्णांक तयार करण्याचा सराव घ्यावा.

# प्रकरण ५ : लांबी व वजन

## लांबी मोजणे

### चर्चा करा.
**खालील चित्राचे निरीक्षण करून दिलेल्या प्रश्नांवर मित्रांसोबत चर्चा करा.**

*(चित्रात वर्गखोलीत विद्यार्थी विविध वस्तू मोजताना दिसत आहेत : शाम खिडकीची बाजू हाताने/वितेने, अनुज व रिना टेबलाची लांबी वितेने, तनुश्री दरवाजाची लांबी पेन्सिलने, अर्णव फळ्याची लांबी मापनटेपने मोजत आहेत.)*

(१) श्याम खिडकीच्या बाजूची लांबी कशाच्या मदतीने मोजत आहे ?  
(२) अनुज आणि रिना टेबलाची लांबी मोजण्यासाठी कशाचा वापर करत आहेत ?  
(३) अनुज व रिना दोघांनी मोजलेली टेबलाची लांबी समान असेल का ? नसेल तर का नाही ?  
(४) तनुश्री दरवाजाची लांबी कशाने मोजत आहे ?  
(५) अर्णव फळ्याची लांबी कशाने मोजत आहे ?  
(६) वीत, पाऊल, हात, पेन्सिल, काठी, दोरी, मापनटेप यांपैकी कशाकशाने लांबी मोजली असता व कोणीही मोजली असता ती समान येईल ?  

> **शिक्षकांसाठी :** वीत, पेन्सिल, दोरी, हात, पाऊल यांसारख्या वेगवेगळ्या अप्रमाणित साधनांचा उपयोग करून लांबी मोजण्याची कृती विद्यार्थ्यांकडून करून घ्यावी. अप्रमाणित एककाकडून प्रमाणित एककांची गरज यावर वर्गात चर्चा घडवून आणावी.

## मीटरपट्टीने मोजणी

कापड मोजण्यासाठी दुकानदार नेहमी मीटरपट्टीचा वापर करतात. त्यामुळे एकाच कापडाची लांबी कोणीही मोजली तरी ती समान भरते. आपल्याला ३ मीटर कापड हवे असेल तर कोणत्याही दुकानातून खरेदी केले, तरी त्याची लांबी ३ मीटरच भरते.

> **मीटरपट्टीची लांबी एक मीटर असते. मीटर हे लांबी मोजण्याचे प्रमाणित एकक आहे.** एक मीटरपेक्षा कमी लांबी असेल तर ती **सेंटीमीटर** या एककात मोजतात.  
> **१ मीटरचे १०० समान भाग केले की, प्रत्येक भाग एक सेंटीमीटर लांबीचा असतो.**  
>  
> **१ मीटर = १०० सेंटीमीटर**

### कृती करा.
**आपण १ मीटर लांबीची दोरी बनवू या.**

> **शिक्षकांसाठी :** विद्यार्थ्यांकडून १ मीटर लांबीची दोरी तयार करून घ्यावी. दोरीच्या साहाय्याने विविध वस्तूंची लांबी मीटर व मीटरपेक्षा कमी लांबीची वस्तू सेंटीमीटर यामध्ये कशी मोजावी याचा विद्यार्थ्यांना सराव द्यावा.

## एक मीटरचा पाव, अर्धा, पाऊण भाग

### समजून घ्या.
- **१.** ही एक मीटर लांबीची दोरी आहे.
- **२.** दोन्ही टोके जुळवली. आता अर्धा मीटर लांबीची दोरी तयार झाली. अर्धा मीटरवर खूण करा.
- **३.** अर्धा मीटर लांबीच्या दोरीची दोन्ही टोके पुन्हा जुळवली की, पाव मीटरची दोरी तयार झाली. पाव मीटरवर खूण करा.
- **४.** दोरी पुन्हा सरळ केली की, त्यावर ३ खुणा दिसतात.

## अंतर मोजणे

दोन झाडांच्या बुंध्यांमधील अंतर मीटरदोरीच्या साहाय्याने मोजले असता ते अंतर (लांबी) ५ मीटरपेक्षा जास्त आहे. आता ते अंतर मीटरपट्टीच्या साहाय्याने मीटर व सेंटीमीटर यांमध्ये पुन्हा मोजू.  
दोन झाडांतील अंतर ५ मीटर पेक्षा जास्त आहे ते उरलेले अंतर मोजपट्टीच्या साहाय्याने मोजू. दोन झाडांच्या बुंध्यांमधील अंतर ५ मीटर ४० सेंटीमीटर आहे.  
**कमी अंतर मोजण्यासाठी मोजपट्टी वापरतात.**  
**जास्त लांबी मोजण्यासाठी मीटर व कमी लांबी मोजण्यासाठी सेंटीमीटर या एककांचा वापर करतात.**

## वजन मोजणे

### जड की हलके ?
भावनाने एका हातात पाठ्यपुस्तक आणि दुसऱ्या हातात पेन धरले आहे.  
भावनांच्या हातातील असणाऱ्या जड वस्तूखाली $\checkmark$ अशी खूण करा.

**खाली दिलेल्या बाबींच्या संदर्भात तुमचे मत व तुमच्या मित्राचे मत योग्य त्या शब्दाभोवती $\bigcirc$ करून नोंदवा.**

| तुलना करण्यासाठी वस्तू | माझा अनुभव | माझ्या मित्राचा अनुभव |
| :--- | :--- | :--- |
| कंपासपेटी व जेवणाचा डबा | कंपासपेटीपेक्षा जेवणाचा डबा **जड / हलका** आहे. | कंपासपेटीपेक्षा जेवणाचा डबा **जड / हलका** आहे. |
| जेवणाचा डबा व दप्तर | जेवणाचा डबा हा दप्तरापेक्षा **जड / हलका** आहे. | जेवणाचा डबा हा दप्तरापेक्षा **जड / हलका** आहे. |
| क्रिकेटचा चेंडू व क्रिकेटची बॅट | क्रिकेटची बॅट क्रिकेटच्या चेंडूपेक्षा **जड / हलकी** आहे. | क्रिकेटची बॅट क्रिकेटच्या चेंडूपेक्षा **जड / हलकी** आहे. |
| बॅट व वही | बॅटपेक्षा वही **जड / हलकी** आहे. | बॅटपेक्षा वही **जड / हलकी** आहे. |

---

### करून बघा : वहीचे वजन करा.
(१) प्रत्येकाने वेगवेगळ्या आकाराच्या १५ ते २० गोट्या घ्या.  
(२) तराजूच्या एका पारड्यात वही ठेवा व दुसऱ्या पारड्यात गोट्या ठेवत जा. दोन्ही पारडी समान होईपर्यंत ही कृती करा.  
(३) त्या वहीचे वजन करण्यासाठी किती गोट्या लागल्या ? त्याच वहीचे वजन करण्यासाठी मित्राने आणलेल्या गोट्यांपैकी किती गोट्या लागल्या ? याची नोंद ठेवा.  

**खालील तक्ता पूर्ण करा.**

| नावे | एका वहीचे वजन करण्यासाठी लागलेल्या गोट्या |
| :--- | :--- |
| अनुजा | १५ गोट्या |
| मीना | २० गोट्या |
| ......... | $\square$ गोट्या |

### चर्चा करा.
- अनुजाने केलेले वहीचे वजन १५ गोट्या तर मीनाने केलेले वजन २० गोट्या आहे, असे का झाले असेल ?
- वहीचे वजन करण्यासाठी प्रत्येकाने वापरलेल्या गोट्यांची संख्या ही गोट्यांचा आकार, गोट्या कशाने बनलेल्या आहेत (काच, शिसे इत्यादी) या मुद्द्यांवर चर्चा करा.
- अनुजाने वहीचे वजन करण्यासाठी वापरलेल्या गोट्या वापरूनच इतर कोणीही त्याच वहीचे वजन केले, तर वजनात फरक पडेल का ?

> **शिक्षकांसाठी :** विद्यार्थ्यांना हे समजून घेणे आवश्यक आहे की जड वस्तू त्यांच्या वजनामुळे खालच्या दिशेने जातात. विद्यार्थ्यांकडून तराजू तयार करून घ्यावा. तराजू वापरून विविध वस्तूंचे वजन करण्याचा अनुभव द्यावा आणि सराव घ्यावा.

# प्रकरण ६ : माहितीचे व्यवस्थापन

### कृती करा.
आनंदमेळ्यासाठी विविध रंगांचे कपडे परिधान करून मुले शाळेत आली होती. त्या वेळी मुलांनी परिधान केलेल्या कपड्यांच्या रंगांच्या नोंदी मनीषा, नीरज आणि सलमा यांनी केल्या.

- **मुलगा :** "वेगवेगळ्या रंगांच्या कपड्यांत सगळे किती छान दिसत आहेत."
- **मनीषा :** "चित्रांवरून कोणाला कोणता रंग आवडतो हे शोधता येईल का ? हे करताना प्रत्येक रंगासाठी उभी रेघ मारू."
- **सलमा :** "अशा रीतीने आपण त्यांच्या कपड्यांच्या रंगांच्या नोंदी तक्त्यात करू."

---

**(१) मनीषा, सलमा व नीरज यांनी संकलित केलेल्या माहितीचे वर्गीकरण करताना ताळ्याच्या खुणांचा वापर केला आहे. त्या खुणा मोजून मुलांची संख्या लिहा.**

| कपड्यांचे रंग | लाल | हिरवा | पिवळा | निळा | एकूण विद्यार्थी |
| :--- | :---: | :---: | :---: | :---: | :---: |
| **ताळ्याच्या खुणा** | ||||| | | ||||| ||| | |||| | ||||| ||||| | |
| **विद्यार्थ्यांची संख्या** | ६ | ......... *(८)* | ......... *(४)* | ......... *(१०)* | ......... *(२८)* |

- **मनीषा :** एकूण २८ विद्यार्थी आहेत. त्यात निळ्या रंगाचे कपडे परिधान केलेल्या मुलांची संख्या सर्वांत जास्त म्हणजे १० आहे.  
- **सलमा :** पिवळ्या रंगाचे कपडे परिधान केलेल्या मुलांची संख्या सर्वांत कमी म्हणजे ४ आहे.  
- **मनीषा :** हिरव्या रंगाचे कपडे परिधान केलेल्या मुलांची संख्या लाल रंगाचे कपडे परिधान केलेल्या मुलांपेक्षा २ ने जास्त आहे.  
- **शिक्षक :** तुम्ही या माहितीचे संकलन कशावरून केले ?  
- **सलमा :** आम्ही २८ मुलांच्या कपड्यांच्या रंगांचे निरीक्षण करून हा तक्ता तयार केला आहे. एका मुलासाठी एक उभी रेघ वापरली आहे.  
- **नीरज :** हो, या रेघा मोजून त्या संख्येच्या रूपात लिहिल्या.  
- **शिक्षक :** या रेघांना **ताळ्याच्या खुणा** म्हणतात.

### क्षेत्रभेट - फळांची माहिती
शाळेने मुलांसाठी एक क्षेत्रभेट आयोजित केली होती. क्षेत्रभेटीसाठी येताना प्रत्येकाने आपल्या जेवणाच्या डब्यासोबत आपल्या आवडीचे एक फळ आणावे असे ठरले.

**(१) वरील चित्राचे निरीक्षण करा. त्यामध्ये दाखवलेल्या माहितीवर चर्चा करा. तक्त्यावरून खालील प्रश्नांची उत्तरे लिहा.**

| फळांची नावे | चिकू | पेरू | केळी | संत्री |
| :--- | :---: | :---: | :---: | :---: |
| **आवडणारे फळ आणलेल्या मुलांची संख्या** | ५ | २ | ३ | ४ |

- क्षेत्रभेटीसाठी एकूण किती मुले आली आहेत ? $\square$ *(१४)*
- चिकू आणलेल्या मुलांची संख्या $\square$ *(५)*
- सर्वांत जास्त मुलांनी आणलेले फळ .................... *(चिकू)* आहे.
- सर्वांत कमी मुलांनी आणलेले फळ $\square$ *(पेरू)* आहे.

**(२) रिकाम्या जागी जास्त / कमी / समान यांपैकी योग्य शब्द लिहा.**
- चिकू आवडणाऱ्या मुलांपेक्षा पेरू आवडणाऱ्या मुलांची संख्या .................... *(कमी)* आहे.
- केळी आवडणाऱ्या मुलांपेक्षा चिकू आवडणाऱ्या मुलांची संख्या .................... *(जास्त)* आहे.
- पेरू आवडणाऱ्या मुलांपेक्षा संत्री आवडणाऱ्या मुलांची संख्या .................... *(जास्त)* आहे.

> **शिक्षकांसाठी :** संकलित केलेल्या माहितीचे वर्गीकरण करताना वापरलेल्या रेघांना 'ताळ्याच्या खुणा' म्हणतात. रेघा मारताना प्रत्येक ५ रेघांनंतर थोडी जागा सोडावी, हे सांगावे, ताळ्याच्या खुणा ही संकल्पना प्राचीन काळी गणितात कशी उदयास आली, हे गोष्टीरूपात सांगावे.

## स्वाध्याय

**(१) चित्रावरून तयार केलेल्या तक्त्याचे निरीक्षण करा व त्या पुढील प्रश्नांची उत्तरे लिहा.**

| एका वर्गातील विद्यार्थ्यांनी शाळेत येण्यासाठी वापरलेली साधने | विद्यार्थ्यांची संख्या |
| :--- | :---: |
| 🚶 **पायी चालत येणारे** | ६ |

| 🛵 **स्कूटर** | २ |
| 🛺 **रिक्षा** | ४ |

**प्रश्नोत्तरे :**
- सर्वाधिक विद्यार्थी .................... *(स्कूलबस)* ने येतात.
- सर्वांत कमी विद्यार्थी .................... *(स्कूटर)* ने येतात.
- स्कूलबसने येणाऱ्या विद्यार्थ्यांची संख्या, रिक्षाने येणाऱ्या विद्यार्थ्यांच्या संख्येपेक्षा .................... *(११ ने जास्त)* आहे.
- सायकलने येणाऱ्या विद्यार्थ्यांची संख्या पायी येणाऱ्या विद्यार्थ्यांच्या संख्येपेक्षा .................... *(१ ने कमी)* आहे.
- सायकलने शाळेत येणाऱ्या विद्यार्थ्यांची संख्या .................... *(पायी / स्कूलबस)* ने शाळेत येणाऱ्या विद्यार्थ्यांच्या संख्येपेक्षा कमी आहे.

> **शिक्षकांसाठी :** चित्राचे निरीक्षण करून त्यावर आधारित तक्ता यांचा सहसंबंध यावर चर्चा करावी. सारणीचे निरीक्षण कसे करावे यावर मार्गदर्शन करावे.

# प्रकरण ७ : नजरी नकाशा

## स्थान व स्थिती

### समजून घ्या.
**कपाटाचे निरीक्षण करून उत्तरे लिहा.**

*(कपाटात तीन कप्पे आहेत :*  
*- वरचा कप्पा : डावीकडे घड्याळ, मध्ये जहाज, उजवीकडे कलश/फुलदाणी*  
*- मधला कप्पा : डावीकडे विमान, मध्ये बैलगाडी, उजवीकडे मोटारगाडी*  
*- खालचा कप्पा : डावीकडे पुस्तके, मध्ये चेंडू, उजवीकडे बॅट)*  

- कपाटाच्या वरच्या कप्प्यात जहाजाच्या डाव्या बाजूस `घड्याळ` आहे.
- कपाटाच्या मधल्या कप्प्यात विमान आणि मोटारगाडी यांच्या मध्ये .................... *(बैलगाडी)* आहे.
- कपाटाच्या .................... *(मधल्या)* कप्प्यातील विमान हे पुस्तकाच्या .................... *(वरच्या)* बाजूस आहे.
- कपाटात मोटारगाडीच्या बरोबर वर .................... *(कलश / फुलदाणी)* आहे.
- विमानाच्या उजवीकडे .................... *(बैलगाडी व मोटारगाडी)* आहे.

---

## दृश्ये : समोरून, वरून, बाजूने

**खुर्चीची विविध दृश्ये खालीलप्रमाणे आहेत :**
1. **खुर्चीचे समोरून दृश्य** (Front View)
2. **खुर्चीचे वरून दृश्य** (Top View)
3. **खुर्चीचे बाजूने दृश्य** (Side View)

> **वस्तूंचे वरून दृश्य, बाजूने दृश्य, समोरून दृश्य अशी वेगवेगळी दृश्ये असतात.**

> **शिक्षकांसाठी :** शाळेत लपाछपीचा खेळ घ्यावा व त्याची माहिती, नियम व दृश्य यांबाबत विद्यार्थ्यांमध्ये चर्चा घडवून आणावी तसेच वर-खाली, डावा-उजवा, जवळ-दूर इत्यादी अवकाशीय संबोधांवर चर्चा घडवून आणावी. परिसरातील विविध वस्तू समोरून, वरून, बाजूने कशा दिसतात याची चर्चा करावी.

---

### छायाचित्रांचे दृश्य ओळखणे
**रजिया, यश आणि मीना यांनी एकाच बसची काढलेली वेगवेगळी छायाचित्रे खाली दिली आहेत.**

- बसचे $\square$ *(समोरून)* दृश्य

* **काड्यांचा उपयोग करून प्रिया, महेश आणि अक्षिता विविध आकार तयार करतात. त्यांच्या बाजू, कोन, शिरोबिंदू यांच्या वैशिष्ट्यांबद्दल चर्चा करतात.**

शिक्षकांनी मीना, शुभांगी आणि विशाल यांना काही रिकामी खोकी उलगडायला दिली. ती खोकी उलगडल्यानंतर घडणीमध्ये दिसणाऱ्या आकारांचे निरीक्षण करायला सांगितले.

* **शुभांगी :** त्रिकोणी प्रिझमची घडणी उलगडते
* **विशाल :** दंडगोलाची घडणी उलगडते

  * (३) दंडगोलाची घडणी $\longrightarrow$ $\dots\dots\dots\dots\dots\dots\dots\dots\dots\dots\dots$

#### आयत
* वर दाखवल्याप्रमाणे एक आयताकार कागद घ्या.
* आता समोरासमोरील कडा एकमेकांशी जोडण्यासाठी कागदाला वर दाखवल्याप्रमाणे मधोमध घडी घाला. म्हणजे जास्त लांबी असलेल्या कडा एकमेकांशी तंतोतंत जुळतील.
* त्याचप्रमाणे कमी लांबी असलेल्या कडा एकमेकांशी तंतोतंत जुळतील.
* **आयताच्या समोरासमोरच्या कडा समान लांबीच्या असतात.**

> **शिक्षकांसाठी :** घडणीतील आकारांच्या गुणधर्माबद्दल विद्यार्थ्यांमध्ये चर्चा घडवून आणावी.

# ११. सममिती

*(पृष्ठ १०३)*

[चित्राचे वर्णन: एका सजवलेल्या दुमजली घरासमोर मुलगा व मुलगी उभे आहेत. घराच्या दोन्ही बाजूंची रचना, खिडक्या, दिवे, आकाशकंदील आणि समोरील रांगोळी सममित आहे.]

वरील चित्राचे निरीक्षण करून डाव्या बाजूला आणि उजव्या बाजूला कोणत्या सारख्या वस्तू दिसतात त्यावर चर्चा करा.

---

### समजून घ्या.

#### आकारातील सममिती :
दिवाळीत आकाशकंदील करण्यासाठी मुलांनी रंगीत कागद आणले. त्यांनी ते वेगवेगळ्या आकारांत कापले. त्यातील एका आयताकार कागदाची अशी घडी घातली की त्याचे दोन समान भाग झाले.

| घडी घालणे | घडी उलगडणे | घडीवर रेघ काढणे |
| :---: | :---: | :---: |
| [आडवी घडी घातली] | [घडी उलगडली] | [घडीवर आडवी रेघ काढली $\leftrightarrow$] |
| [उभी घडी घातली] | [घडी उलगडली] | [घडीवर उभी रेघ काढली $\updownarrow$] |

आयताकार कागदाला वरीलप्रमाणे घडी घातल्यावर दोन्ही भाग तंतोतंत जुळतात म्हणजे हा आकार त्या रेषेच्या संदर्भात सममित आहे.

---

### चर्चा करा.

[चित्रात आयताकार कागदाला कर्णावर तिरपी घडी घालताना दाखवले आहे]  
आयताकार कागदाला अशी घडी घातली तर तयार होणारे भाग तंतोतंत जुळतील का ?

> **ज्या आकृतीचे एखाद्या रेषेने दोन समान भाग होतात. ती आकृती सममित आकृती असते व ती रेषा त्या आकृतीचा सममित अक्ष असतो.**

[चित्रात आयताचे सममित अक्ष दर्शवले आहेत.]

---

> **शिक्षकांसाठी :** विद्यार्थ्यांना सममित/असममित आकार तयार करायला सांगणे.

*(पृष्ठ १०३ समाप्त)*

---

*(पृष्ठ १०४)*

### करून बघा.

**(१) खालील आकार कागदावर काढा व कडांवर कापून घ्या. त्याला घडी घालून त्या आकारातील सममिती शोधा.**

1. समद्विभुज त्रिकोण ($\triangle$)
2. त्रिकोण ($\triangle$)
3. आयत ($\Box$)
4. चौरस ($\square$)
5. वर्तुळ ($\bigcirc$)

---

**(२) पुढील प्रत्येक आकृतीवर ट्रेस पेपर ठेवून रेखाटन करून कडेने कापा. घडी घालून त्या आकारांची सममिती शोधा. घडी घातल्यावर जे आकार एकमेकांशी जुळत नाहीत ते वेगवेगळे करा. ते आकार सममित नाहीत हे लक्षात घ्या.**

1. बाण ($\Downarrow$)
2. अनंत चिन्ह ($\infty$)
3. काटकोन त्रिकोण
4. विशालकोन त्रिकोण
5. वर्तुळ (दोन रंगीत अर्धवर्तुळे)
6. बाणाचे टोक / अनियमित बहुभुज
7. पाण्याचा थेंब आकार
8. पायऱ्यांचा अनियमित आकार
9. वर्तुळातून कापलेला भाग (Pac-man आकार)

---

**(३) नववर्षा निमित्ताने आपल्याला विविध आकारांची शुभेच्छापत्रे मिळतात. काही शुभेच्छापत्रांवरील आकार दिलेले आहेत. ते सममित होण्यासाठी योग्य ठिकाणी अक्ष काढा. (अशी काही शुभेच्छापत्रे तयार करा.)**

1. चौकोनी नक्षीदार शुभेच्छापत्र
2. वर्तुळाकार फुलाची रांगोळी डिझाईन
3. आकाशकंदील शुभेच्छापत्र
4. पणती (दिवा) शुभेच्छापत्र
5. नक्षीदार पतंग/फुलपाखरू शुभेच्छापत्र

---

**(४) सममिती गुणधर्माचा उपयोग करून, रंगीत कागद वापरून मुखवटे तयार करा.**

1. अस्वल मुखवटा
2. कोल्हा मुखवटा
3. सिंह मुखवटा

---

**(५) तुमच्या परिसरातील झाडांच्या पानांचे निरीक्षण करा. त्यातील सममिती शोधा.**

**(६) पुढील पानांतील सममित अक्ष शोधून ते पेन/पेन्सिलिने गिरवा.**

1. पिंपळाचे/झाडाचे पान १
2. त्रिपर्णी पान २
3. लांबट पान ३
4. हृदयाकृती पान ४
5. वडाचे/ओकचे पान ५

---

> **शिक्षकांसाठी :** मुलांना त्यांच्या सभोवतालच्या सममित असलेल्या व सममित नसलेल्या आकारांमधील फरक अनुभवण्यासाठी प्रोत्साहित करा. त्यांना त्याचे स्पष्टीकरण सांगण्याची संधी द्यावी. विविध सण साजरे करताना तसेच प्रसंगानुरूप सजावट करताना ती सौंदर्यात्मक दृष्टिने आकर्षक व्हावी म्हणून सममिती कशी उपयोगी पडते. याविषयी विद्यार्थ्यांना अनुभव द्यावेत.

*(पृष्ठ १०४ समाप्त)*

---

*(पृष्ठ १०५)*

### ठिपक्यांचा कागद वापरून सममित आकृती काढणे.

**(१) दिलेल्या रेषा सममित अक्ष होण्यासाठी आकृती पूर्ण करा.**

1. [डाव्या बाजूस त्रिकोणाकृती छप्पर व घराची अर्धी आकृती आणि उभी सममित अक्ष रेषा $\updownarrow$]
2. [उजव्या बाजूस किल्ल्याचा बुरूज व खिडकी असलेली अर्धी आकृती आणि डावीकडे सममित अक्ष रेषा $\updownarrow$]
3. [डाव्या बाजूस पायऱ्यांचा आकार असलेली अर्धी आकृती आणि उजवीकडे सममित अक्ष रेषा $\updownarrow$]
4. [डाव्या बाजूस घराचा आकार असलेली अर्धी आकृती आणि उजवीकडे सममित अक्ष रेषा $\updownarrow$]

---

**(२) दिलेल्या सममिती अक्षाच्या दुसऱ्या बाजूची प्रतिमा पूर्ण करून, प्रतिमेमध्ये कोणता आकार लपला आहे ते ओळखा आणि चित्र पूर्ण करा.**

1. [मधमाशी / किडा - डावा अर्धा भाग दिलेला आहे, उजवा भाग पूर्ण करा] $\rightarrow$ **मधमाशी**
2. [फुलपाखरू - डावा अर्धा भाग दिलेला आहे, उजवा भाग पूर्ण करा] $\rightarrow$ **फुलपाखरू**
3. [सिंह - डावा अर्धा भाग दिलेला आहे, उजवा भाग पूर्ण करा] $\rightarrow$ **सिंह**

---

### करून बघा.

#### घड्याळांच्या काट्याच्या दिशेने (घटीवत्) सममित आकार फिरवून बघा.

[घटीवत् दिशा दर्शवणारे घड्याळ व बाण]

| मूळ स्थिती | $९०^\circ$ फिरवले ($\curvearrowright$) | $१८०^\circ$ फिरवले ($\curvearrowright$) | $२७०^\circ$ फिरवले ($\curvearrowright$) |
| :---: | :---: | :---: | :---: |
| [चौरसात कर्ण रेषा: खालून डावीकडून वर उजवीकडे] | [चौरसात कर्ण रेषा: वरून डावीकडून खाली उजवीकडे] | [चौरसात कर्ण रेषा: खालून डावीकडून वर उजवीकडे] | [चौरसात कर्ण रेषा: वरून डावीकडून खाली उजवीकडे] |

---

> **शिक्षकांसाठी :** महाराष्ट्रात रांगोळीचा वापर सण, उत्सव या प्रसंगी सजावटीसाठी केला जातो. तसा तामिळनाडू राज्यामध्ये ही परंपरा कोलम या प्रकारातून तर बंगालमध्ये अलिपना या नावाने ही कला जोपासली जाते. याचा वापर आपल्याला आकृतिबंध, क्रमवेश व संवेश, सममिती अभ्यासण्यासाठी होतो हे स्पष्ट करावे. आपली संस्कृती जपताना इतरांच्या संस्कृतीचा आपण आदर केला पाहिजे याची जाणीव विद्यार्थ्यांना करून द्यावी. गणित विषयाचा इतर विषयाशी असणारा सहसंबंध स्पष्ट करावा. प्राचीन काळी अनेक मंदिरे, मस्जिद, चर्च, विहार यांमध्ये अशा आकाराच्या कलाकृती सापडतात. त्यावरून ही कला हजारो वर्षांपूर्वी अस्तित्वात होती याची जाणीव विद्यार्थ्यांना करून द्यावी. ताजमहाल, बिबीका मकबरा, महाराष्ट्रातील प्रसिद्ध लेणी, प्राचीन वास्तू या ठिकाणी नक्षींमध्ये अप्रतिम अशी सममिती पाहायला मिळते. अशी काही आपल्या परिसरातील सममितीची उदाहरणे सांगा. चिकटवहीमध्ये अशा चित्रांचा, फोटोंचा संग्रह करण्यास सांगावे.

*(पृष्ठ १०५ समाप्त)*

---

*(पृष्ठ १०६)*

#### घड्याळाच्या काट्यांच्या विरुद्ध दिशेने सममित (प्रतिघटीवत) फिरवून बघा.

[प्रतिघटीवत् दिशा दर्शवणारे घड्याळ, फिरकी आणि ४ पात्यांचा स्वस्तिक सदृश आकार]

---

### मला समजले.

> **घड्याळाच्या काट्यांच्या दिशेने किंवा विरूद्ध दिशेने सममित आकार फिरवले तरी त्या आकारात बदल होत नाही.**

---

## स्वाध्याय

**(१) दिलेल्या आकृतीचे निरीक्षण करा. ती आकृती सममित होण्यासाठीचा भाग पर्यायांतून ओळखा त्याखालील चौकटीत $\checkmark$ अशी खूण करा.**

* **प्रश्न १ :**
  [दिलेली आकृती: तीन चौरसांची जोडणी (वर २ चौरस, खाली डावीकडे १ चौरस)]  
  पर्याय :  
  १) त्रिकोण ($\triangle$) $\rightarrow$ [ &emsp; ]  
  २) चौरस ($\square$) $\rightarrow$ [ $\checkmark$ ]

* **प्रश्न २ :**
  [दिलेली आकृती: वर तिरपा चौरस (समभुज चौकोन) आणि खाली डावीकडे उभा आयत जोडलेला]  
  पर्याय :  
  १) उभा आयत/काटकोन चौकोन $\rightarrow$ [ $\checkmark$ ]  
  २) तिरपा आयत $\rightarrow$ [ &emsp; ]

---

> **शिक्षकांसाठी :** घड्याळाच्या काट्यांच्या दिशेने व विरुद्ध दिशेने फिरवताना वस्तूच्या आकारात, स्थितीत कसा बदल होतो त्याचा अंदाज करायला लावणे. त्याचे उपयोजन स्पष्ट करावे. या सममितीची दैनंदिन जीवनातील उदाहरणे द्यावी. विविध इन्फोग्राफिक्समध्ये, जाहिरातीमध्ये यांचा कसा वापर करतात हे स्पष्ट करावे.

*(पृष्ठ १०६ समाप्त)*

# १२. आकारमान व धारकता

*(पृष्ठ १०७)*

[चित्रात ग्लास, वाटी, बादली आणि पाण्याची बाटली दाखवली आहे.]

### निरीक्षण करा.

| ग्लास | वाटी | बादली | बाटली |
| :---: | :---: | :---: | :---: |
| [ &emsp; ] | [ &emsp; ] | [ $\checkmark$ ] | [ &emsp; ] |

**वरील भांडी पाण्याने पूर्ण भरायची आहेत. वरीलपैकी ज्या भांड्यात सर्वात जास्त पाणी मावेल त्याखाली $\checkmark$ अशी खूण करा.**

---

### चर्चा करा.

**(१) रमेशने पातेल्यात एकाच आकाराच्या १० वाट्या पाणी ओतले तेव्हा पातेले पूर्ण भरले. अनघाने त्याच पातेल्यात ४ तांबे पाणी ओतले तेव्हा पातेले पूर्ण भरले. असे का झाले असेल ?**

* पातेल्यातील पाण्याचे मापन वेगवेगळे आले, कारण मापन करण्यासाठी वेगवेगळी साधने वापरली आहेत. या पातेल्याची धारकता १० वाट्या तसेच ४ तांबे आहे. एकच पातेले भरण्यासाठी वेगवेगळी भांडी (मापे) वापरली आहेत.

---

### धारकता

#### समजून घ्या.
दोन्ही पातेल्याची धारकता ४ तांबे आहे. कारण येथे एकके (तांबे) समान आहेत. यावरून लक्षात येते की धारकता मोजण्यासाठी कोणीही एकाच प्रकारचे साधन वापरले तर मापन सारखेच येते.

दिलेल्या पातेल्यात कोणीही व कोणत्याही एकाच साधनाने पाणी भरले तरी त्या पातेल्याची धारकता सारखीच येते यासाठी प्रमाणित एकके वापरतात.

---

### मला समजले.

> **कोणीही मापन केले तरीही ते सारखेच येण्यासाठी असलेले प्रमाणित एकक वापरणे गरजेचे आहे.**  
> **लीटर हे द्रवपदार्थ मोजण्याचे प्रमाणित एकक आहे.**

*(पृष्ठ १०७ समाप्त)*

---

*(पृष्ठ १०८)*

### आकारमान

गौरी दूधवाल्या काकांना दररोज माप वापरून दूध मोजून देताना पाहते.

[चित्र: दूधवाले काका किटलीतून १ लिटरच्या मापाने गौरीच्या बाटलीत दूध ओतत आहेत.]

[चित्र: गौरी पाण्याच्या बाटलीतून मगात पाणी ओतताना विचार करत आहे.]

> "माझ्याकडे एक लीटर पाण्याची बाटली आहे. त्यातील पाणी मी एका मगामध्ये ओतल्यावर तो मग पाण्याने काठोकाठ भरतो."

दूधाच्या किटलीत १० लीटर दूध होते म्हणजे किटलीतील दुधाचे आकारमान १० लीटर आहे. त्यांपैकी १ लीटर माझ्या बाटलीत ओतले, म्हणजे माझ्या बाटलीतील दुधाचे आकारमान १ लीटर आहे.

---

### चर्चा करा.

* कोणत्या पदार्थांच्या मापनासाठी लीटरचे माप वापरतात ? चर्चा करा.
* लीटर हा शब्द कोणकोणत्या वस्तूंची बंद पाकिटे, बंद डबे, बाटल्या इत्यादींवर असतो ते शोधा. त्या वस्तूंची यादी करून चर्चा करा.

---

### अंदाज करा.

**(१) खालील वाक्यांतील योग्य पर्याय निवडा.**

* पेल्यामध्ये अंदाजे १ लीटरपेक्षा **जास्त / <u>कमी</u>** पाणी मावेल.
* बादलीमध्ये अंदाजे १ लीटरपेक्षा **<u>जास्त</u> / कमी** पाणी मावेल.
* मगमध्ये अंदाजे १ लीटरपेक्षा **जास्त / कमी / <u>तेवढे</u>** पाणी मावेल.

*(पृष्ठ १०८ समाप्त)*

---

*(पृष्ठ १०९)*

### करून बघा.

तुमच्या घरातील वेगवेगळ्या आकारांची दोन भांडी घ्या. उदाहरणार्थ: एक लहान वाटी, पेला. १ लीटरची बाटली भरण्यासाठी त्यात किती लहान वाट्या पाणी ओतावे लागेल ? १ लीटरची बाटली भरण्यासाठी किती पेले पाणी बाटलीमध्ये ओतावे लागेल ? प्रथम अंदाज लावा आणि नंतर प्रत्यक्ष पाणी ओता आणि तुमचा अंदाज बरोबर आहे का याचा पडताळा घ्या.

| भांडी | १ लीटरची बाटली (अंदाजे माप) | पाण्याने पूर्ण भरणे (प्रत्यक्ष माप) |
| :---: | :---: | :---: |
| वाटी $\smile$ | &emsp; | &emsp; |
| पेला $\square$ | &emsp; | &emsp; |

* १ लीटरपेक्षा जास्त पाणी साठवले जाऊ शकते. अशा भांड्यांची यादी करा.

---

### मला समजले.

> **घागर, बादली, पिंप, हंडा, पातेले किंवा इतर कोणतेही भांडे पूर्ण भरण्यासाठी जेवढे पाणी त्यात मावते ती त्या भांड्याची धारकता असते. एका भांड्यात २ लीटर पाणी मावते तर त्या भांड्याची धारकता २ लीटर आहे.**

---

### सांगा बरे !

[चित्रे: कार, मोटारसायकल, स्कूल व्हॅन/मिनीबस]

वरीलपैकी कोणत्या वाहनाच्या इंधनाच्या टाकीत सर्वात जास्त डिझेल मावेल ? **<u>स्कूल व्हॅन / मिनीबस</u>**

> **ज्या वाहनाच्या टाकीत सर्वात जास्त डिझेल मावेल त्या वाहनाच्या टाकीची धारकता जास्त आहे.**

---

### खालील चित्रांचे निरीक्षण करा.

[चित्रात १ लिटर, अर्धा लिटर, पाव लिटर व पाऊण लिटर भरलेल्या चार बाटल्या दाखवल्या आहेत ज्यांवर १०० मिली ते १००० मिली पर्यंतच्या खुणा आहेत.]

| बाटली १ | बाटली २ | बाटली ३ | बाटली ४ |
| :---: | :---: | :---: | :---: |
| **एक लीटर** | **अर्धा लीटर** | **पाव लीटर** | **पाऊण लीटर** |

*(पृष्ठ १०९ समाप्त)*

---

*(पृष्ठ ११०)*

(१) येथे पहिल्या बाटलीत चार भाग कोकम सरबताने भरलेले आहेत. म्हणजेच बाटलीत **एक लीटर** कोकम सरबत आहे.  
(२) दुसऱ्या बाटलीत ४ भागांपैकी केवळ दोनच भाग कोकम सरबताने भरलेले आहेत. म्हणजेच बाटलीत **अर्धा लीटर** कोकम सरबत आहे.  
(३) तिसऱ्या बाटलीत ४ भागांपैकी एक भाग कोकम सरबताने भरलेला आहे. म्हणजेच बाटलीत **पाव लीटर** कोकम सरबत आहे.  
(४) चौथ्या बाटलीत ४ भागांपैकी तीन भाग कोकम सरबताने भरलेले आहेत. म्हणजेच बाटलीत **पाऊण लीटर** कोकम सरबत आहे.  

---

### करून बघा.

* दोन वेळा पाव लीटर पाणी घेतले की, **अर्धा लीटर** पाणी होते.
* पाव लीटर आणि अर्धा लीटर मिळून **पाऊण लीटर** होतात.
* तीन वेळा पाव लीटर मिळून **पाऊण लीटर** होते.

---

### कृती करा.

(१) एक लीटर धारकतेची एक बाटली घ्या.  
(२) त्या बाटलीवर शिक्षकाच्या मदतीने पाव, अर्धा, पाऊण अशा खुणा करा.  
(३) एक रिकामे पातेले घ्या.  
(४) खुणा केलेल्या बाटलीच्या मदतीने रिकामे पातेले पाण्याने पूर्ण भरा. पातेल्याची धारकता काढा. हीच कृती करून वेगवेगळ्या भांड्यांची धारकता काढा.  

---

### प्रथम अंदाज करा नंतर १ लीटर बाटलीचा वापर करून पाणी भरून बघा. योग्य उत्तराला $\checkmark$ अशी खूण करा.

(१) साधारणतः एका बादलीत किती पाणी मावते ? $\rightarrow$ **<u>एक लीटरपेक्षा जास्त</u> / कमी पाणी मावते.**  
(२) साधारणतः एका मगामध्ये किती पाणी मावते ? $\rightarrow$ **अर्धा लीटरपेक्षा जास्त / <u>कमी</u> पाणी मावते.**  
(३) साधारणतः एका तांब्यामध्ये किती पाणी मावते ? $\rightarrow$ **<u>पाव लीटरपेक्षा जास्त</u> / कमी पाणी मावते.**  

---

> **शिक्षकांसाठी :** विद्यार्थ्यांना वेगवेगळी भांडी वापरून प्रत्यक्ष पाण्याचे मोजमाप करण्याची संधी देऊन आलेल्या निष्कर्षांवर चर्चा घडवून आणावी. तसेच १ लीटरची, अर्ध्या लीटरची मापे वापरून पाणी मोजण्याची कृती करून घ्यावी. आकारमान आणि धारकता या संकल्पना स्पष्ट कराव्यात. त्यातील फरक समजावून सांगावा.

*(पृष्ठ ११० समाप्त)*

# १३. कालमापन

### समजून घ्या.

[घड्याळात २ वाजलेले दाखवले आहेत]

* **मोठा काटा (मिनिट काटा):**
  * मी आहे मोठा काटा. माझे नाव **मिनीट काटा**.
  * मी घड्याळात मिनिटे दर्शवतो.
  * मी एका संख्येवरून पुढील संख्येवर गेलो की **५ मिनिटे** होतात.

* **लहान काटा (तास काटा):**
  * मी आहे लहान काटा. माझे नाव **तास काटा**.
  * मी घड्याळातील तास दर्शवतो.
  * मी एका संख्येवरून पुढील संख्येवर गेलो की **१ तास** होतो.

तास काटा २ वर व मिनिट काटा १२ वर आहे. म्हणजेच घड्याळात २ वाजले आहेत.  
घड्याळात मिनिट काटा १२ पासून पुढे जात पुन्हा १२ वर येतो तेव्हा एकूण ६० मिनिटे होतात. म्हणजेच १ तास होतो.

> **एका तासात ६० मिनिटे असतात. तास, मिनिटे ही कालमापनाची एकके आहेत.**

---

### घड्याळ वाचन

[चित्रात मुलगा आईला विचारत आहे; घड्याळात २ वाजून २० मिनिटे झाली आहेत]

* **मुलगा :** आई, किती वाजले बरे !
* **आई :** घड्याळात तास काटा २ च्या पुढे गेला म्हणजे २ वाजून गेले. प्रत्येक दोन लगतच्या संख्यांच्या घरांत ५-५ मिनिटांचे अंतर आहे, म्हणून ज्या संख्येवर मिनिट काटा असतो, त्या संख्येपर्यंत ५ चा पाढा म्हणावा. येथे मिनिट काटा ४ वर आहे, तर ५ चा पाढा ४ पर्यंत म्हण. ५ चोक २० म्हणजे २० मिनिटे होतील म्हणून घड्याळात २ वाजून २० मिनिटे झाली आहेत.

## स्वाध्याय

**(१) आकृतिबंध ओळखून मांडणी पूर्ण करा.**

1. [० पाकळी, २ पाकळ्या, ३ पाकळ्या, ४ पाकळ्या, ५ पाकळ्या, ० पाकळी, २ पाकळ्या, ...]  
   $\rightarrow$ **३ पाकळ्या, ४ पाकळ्या, ५ पाकळ्या**
2. [फूल, पान, फूल, पान, ...]  
   $\rightarrow$ **फूल, पान, फूल, पान**
3. [चौरस अर्धा रंगवलेला: वर, खाली, डावीकडे, उजवीकडे ...]  
   $\rightarrow$ **रंगीत चौरसांची पुनरावृत्ती**
4. $\land, \lor, <, >, \land, \lor, <, >$  
   $\rightarrow$ **$\land, \lor, <, >$**
5. [किडा/चेहरा: डोळे/अँटेना बदलणारा क्रम]  
   $\rightarrow$ **पुढील क्रमानुसार आकृत्या**
6. $\bigcirc, \triangle, \square, \bigstar, \bigstar, \bigcirc, \triangle, \square, \bigstar, \bigstar$  
   $\rightarrow$ **$\bigcirc, \triangle, \square, \bigstar, \bigstar$**

---

> **शिक्षकांसाठी :** विद्यार्थ्यांना रेषांनी तयार झालेल्या नक्षीचे निरीक्षण करावयास सांगावे, त्यावर चर्चा घडवावी. विविध रेषांच्या साहाय्याने आकृतिबंध पूर्ण करण्याचा सराव घ्यावा. कागदाला घड्या घालून, कापून आकृतिबंध तयार करण्याचा सराव घ्यावा. गणिती पेटीतील विविध भौमितिक आकारांचा वापर करून विद्यार्थ्यांकडून विविध आकृतिबंध तयार करण्याचा सराव घ्यावा.

    <script>
        // Render Markdown
        const rawMd = document.getElementById("rawMarkdown").textContent;
        document.getElementById("markdownContainer").innerHTML = marked.parse(rawMd);

        // Font scaling
        let currentSize = 17;
        function changeFontSize(delta) {
            currentSize = Math.max(14, Math.min(26, currentSize + delta));
            document.documentElement.style.setProperty('--font-size', currentSize + 'px');
        }

        // Theme toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }

        function scrollToText(str) {
            const headings = Array.from(document.querySelectorAll('h1, h2, h3'));
            const match = headings.find(h => h.textContent.includes(str));
            if (match) match.scrollIntoView({ behavior: 'smooth' });
        }

        function filterContent() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('markdownContainer');
            if (!q) {
                container.innerHTML = marked.parse(rawMd);
                return;
            }
            const regex = new RegExp(`(${q})`, 'gi');
            const highlighted = marked.parse(rawMd).replace(regex, '<mark>$1</mark>');
            container.innerHTML = highlighted;
        }
